// Полный тур: все команды разбиты на пары, матчи разнесены на два дня
function demoRound(leagueId, n) {
  const teams = DEMO_TEAMS[leagueId] || DEMO_TEAMS["4328"];
  const half = Math.floor(teams.length / 2);
  const shift = (n - 1) % Math.max(1, teams.length - 1);
  const ucl = leagueId === "4480";
  const out = [];

  for (let i = 0; i < half; i++) {
    const home = teams[i];
    const away = teams[(teams.length - 1 - i + shift) % teams.length];
    if (home === away) continue;
    const dayShift = i < Math.ceil(half / 2) ? 0 : 1;
    const date = demoDate(-(3 - dayShift), 17 + (i % 3) * 2);
    const past = date.getTime() < Date.now();
    out.push({
      src: "demo",
      id: `demo-round-${leagueId}-${n}-${i}`,
      title: `${home} - ${away}`, home, away, homeBadge: "", awayBadge: "",
      homeScore: past ? Math.floor(seeded(i + n * 3) * 4) : null,
      awayScore: past ? Math.floor(seeded(i * 5 + n) * 3) : null,
      stage: { kind: ucl ? "leaguePhase" : "matchday", n },
      venue: "", date, ts: date.getTime(), live: false, finished: past
    });
  }
  return out.sort((a, b) => a.ts - b.ts);
}

function demoTable(leagueId) {
  const teams = DEMO_TEAMS[leagueId] || DEMO_TEAMS["4328"];
  const z = ZONES[leagueId] || ZONES["4328"];
  const n = teams.length;
  const played = 10;

  // Сначала считаем показатели, места расставим после сортировки —
  // иначе в таблице попадаются строки, где очков больше, чем у соседа сверху
  const rows = teams.map((team, i) => {
    const win = Math.max(0, Math.min(played, Math.round((n - i) / n * 8) - Math.floor(seeded(i) * 2)));
    const draw = Math.min(played - win, Math.floor(seeded(i * 3) * 4));
    const loss = played - win - draw;
    const gf = win * 2 + draw + Math.floor(seeded(i * 5) * 6);
    const ga = loss * 2 + Math.floor(seeded(i * 9) * 5);
    return { team, badge: "", played, win, draw, loss, gf, ga,
             gd: gf - ga, points: win * 3 + draw, seed: i };
  });

  rows.sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);

  return rows.map((r, i) => {
    const rank = i + 1;
    // Форма: чем выше место, тем чаще победы
    const form = Array.from({ length: 5 }, (_, k) => {
      const rnd = seeded(r.seed * 17 + k * 3);
      const winChance = 0.75 - (i / n) * 0.55;
      return rnd < winChance ? "W" : rnd < winChance + 0.22 ? "D" : "L";
    }).join("");

    const zone = rank <= z.ucl ? "ucl"
      : rank <= z.uel ? "uel"
      : rank <= z.uecl ? "uecl"
      : (z.rel && rank > n - z.rel) ? "rel" : null;

    return { ...r, rank, form, zone };
  });
}

// Демо-статистика игроков: числа выдуманы, имена — заглушка для вёрстки
function demoPlayers(leagueId, kind) {
  const src = DEMO_PLAYERS[leagueId] || DEMO_PLAYERS["4328"];
  // У ассистентов порядок другой — иначе список выглядит копией бомбардиров
  const list = kind === "assists"
    ? src.map((x, i) => [x, seeded(i * 23 + 5)]).sort((a, b) => a[1] - b[1]).map((x) => x[0])
    : src;
  return list.map(([name, team], i) => {
    const base = kind === "assists" ? 11 : 15;
    const primary = Math.max(1, base - i - Math.floor(seeded(i * 7) * 2));
    const other = Math.max(0, Math.floor(primary * (kind === "assists" ? 0.7 : 0.45)) - Math.floor(seeded(i) * 2));
    return {
      rank: i + 1, name, photo: "", team, teamBadge: "",
      games: 10 + Math.floor(seeded(i * 11) * 3),
      goals: kind === "assists" ? other : primary,
      assists: kind === "assists" ? primary : other,
      penalty: Math.floor(seeded(i * 13) * 3)
    };
  });
}

function demoFor(sport, league, view) {
  if (view === "table") return demoTable(league.id);
  const past = view === "results";
  if (sport.id === "f1") return demoF1(past);
  if (sport.id === "ufc") return demoUFC(past);
  return demoMatches(league.id, past);
}

function railHTML(m) {

  if (L && L.short) return `<span class="stagetag" title="${esc(L.full)}">${esc(L.short)}</span>`;

// Дата под пластиной: «пт, 28.08». Нужна, чтобы карточка читалась сама по
// себе — во вкладке «Тур» матчи идут подряд за разные дни, и заголовка дня
// над ними нет.
function scoreDateHTML(d) {
  if (!d) return "";
  return `<span class="scoredate">${esc(t().dow[dowIndex(d)])}, ${esc(fmtShort(d))}</span>`;
}

function screenHTML(m, upcoming) {
  let plate;
  if (m.live) {
    // идёт прямо сейчас — красный контур
    plate = `<div class="screen screen--live">
      <span class="num">${m.homeScore ?? 0}</span><span class="sep">:</span><span class="num">${m.awayScore ?? 0}</span>
    </div>`;
  } else if (!upcoming && m.homeScore !== null) {
    // сыгран — счёт «отчеканен» в золоте
    plate = `<div class="screen screen--final">
      <span class="num">${m.homeScore}</span><span class="sep">:</span><span class="num">${m.awayScore}</span>
    </div>`;
  } else {
    // ещё не сыгран — контур и время начала
    plate = `<div class="screen"><span class="clock">${esc(fmtTime(m.date))}</span></div>`;
  }
  return `<div class="scorebox">${plate}${scoreDateHTML(m.date)}</div>`;
}

function matchHTML(m, upcoming) {
  const L = stageLabel(m.stage);
  const note = L && L.note ? L.note : null;
  const foot = [];
  if (m.live) foot.push(`<span class="tag tag--live"><span class="dot-live"></span>${esc(t().live)}</span>`);
  if (note)   foot.push(`<span class="tag">${esc(note)}</span>`);
  if (m.venue) foot.push(`<span class="tag">${esc(m.venue)}</span>`);

  // Карточка — ссылка на окно матча: «назад» его закроет, ссылкой можно поделиться
  const id = String(m.id || "");
  const link = MATCH_ID.test(id);
  const open = link ? `<a class="match" href="${esc(matchHref(id))}" data-mid="${esc(id)}">` : `<article class="match">`;

  return `
  ${open}
    <div class="rail">${railHTML(m)}</div>
    <div class="row">
      <div class="side side--home">
        <span class="name">${esc(clubName(m.home))}</span>
        ${badgeHTML(m.homeBadge, m.home)}
      </div>
      ${screenHTML(m, upcoming)}
      <div class="side side--away">
        ${badgeHTML(m.awayBadge, m.away)}
        <span class="name">${esc(clubName(m.away))}</span>
      </div>
    </div>
    ${foot.length ? `<div class="foot">${foot.join("")}</div>` : ""}

}

  return `
  <article class="event">
    <div class="rail">${railHTML(m)}</div>
    <div class="event-right">
      <div style="min-width:0">
        <div class="event-title">${esc(m.title || `${m.home} vs ${m.away}`)}</div>
        <div class="event-sub">${esc(fmtDay(m.date))}${m.venue ? " · " + esc(m.venue) : ""}</div>
      </div>
      ${right}
    </div>
  </article>`;
}

function renderList(items, sport, upcoming, flat) {
  if (!items.length) return notice(t().emptyTitle, t().emptyText);

  // Запоминаем показанные матчи: окно откроется сразу, без лишнего запроса
  if (sport.kind === "match") for (const m of items) if (m.id) matchIndex.set(String(m.id), m);

  if (sport.kind === "event") {
    return `<div class="list">${items.map((m) => eventHTML(m, upcoming)).join("")}</div>`;
  }

  // Плоский список без заголовков дней — для календаря и для одного тура
  if (flat) {
    return `<div class="list">${items.map((m) => matchHTML(m, upcoming)).join("")}</div>`;
  }

  const groups = new Map();
  for (const m of items) {
    const k = dayKey(m.date);
    if (!groups.has(k)) groups.set(k, { date: m.date, items: [] });
    groups.get(k).items.push(m);
  }

  let html = `<div class="list">`;
  for (const g of groups.values()) {
    html += `<section class="daygroup"><h2 class="dayhead">${esc(fmtDay(g.date))}</h2>`;
    for (const m of g.items) html += matchHTML(m, upcoming);
    html += `</section>`;
  }
  return html + `</div>`;
}

/* ---------- Календарь ---------- */

function calendarHTML() {
  const L = t();
  const month = state.calMonth;
  const first = startOfMonth(month);
  const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  const lead = dowIndex(first);              // пустые клетки до 1-го числа
  const today = new Date();

  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span class="cal-cell cal-cell--empty"></span>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(month.getFullYear(), month.getMonth(), day);
    const iso = isoKey(d);
    const has = state.dayIndex.get(iso)?.size || 0;
    const cls = [
      "cal-cell",
      sameDay(d, state.calDay) ? "is-selected" : "",
      sameDay(d, today) ? "is-today" : "",
      has ? "has-games" : ""
    ].filter(Boolean).join(" ");
    cells += `<button class="${cls}" data-day="${iso}"${has ? ` title="${has}"` : ""}>` +
             `${day}<i class="cal-dot" aria-hidden="true"></i></button>`;
  }

  const dows = L.dow.map((n) => `<span class="cal-dow">${esc(n)}</span>`).join("");

  return `<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" data-month="prev" aria-label="${esc(L.monthPrev)}">‹</button>
      <span class="cal-title">${esc(fmtMonth(month))}</span>
      <button class="cal-nav" data-month="next" aria-label="${esc(L.monthNext)}">›</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div>
  </div>`;
}

// Если ключу доступен не текущий сезон — говорим об этом прямо,
// чтобы старые цифры не выглядели свежими
// Ключ вписан, но источник не ответил — объясняем, почему таблица короткая
function fdHintHTML() {
  const e = state.fdError;
  if (!e) return "";
  const L = t();
  const kind = e.kind && L.err[e.kind] ? e.kind : null;
  const why = kind ? L.err[kind] + (kind === "http" && e.detail ? ` ${e.detail}.` : "") : "";
  const fix = kind ? L.errFix[kind] : "";
  return `<p class="hint">${esc(L.fdFailed)} ${esc(why)}` +
         (fix ? `<br><span class="hint-fix">${esc(fix)}</span>` : "") + `</p>`;
}

function seasonHintHTML() {
  if (!state.seasonShift) return "";
  const y = state.seasonShift;
  return `<p class="hint">${esc(t().seasonOld)} ${y}/${y + 1}.</p>`;
}

function notice(title, text, retry) {
  return `<div class="list"><div class="notice">
    <b>${esc(title)}</b>${esc(text)}
    ${retry ? `<br><button data-retry>${esc(t().retry)}</button>` : ""}
  </div></div>`;
}

const skeleton = () => `<div class="list">${'<div class="skel"></div>'.repeat(6)}</div>`;

/* ---------- Окно матча ---------- */

const IC_X = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
const IC_PLAY = `<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>`;
const IC_PIN = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
const IC_SUB = `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13V3M2.2 5.8 5 3l2.8 2.8" stroke="#1B8A4B"/><path d="M11 3v10M8.2 10.2 11 13l2.8-2.8" stroke="#D6280F"/></svg>`;

// Мяч: пятиугольник в центре и пять заплаток по краю
function ballIcon(cls, crossed) {
  return `<svg class="ic${cls ? " " + cls : ""}" viewBox="0 0 16 16" aria-hidden="true">` +
    `<circle cx="8" cy="8" r="7" fill="#fff"/>` +
    `<path fill="currentColor" d="M8 5.3l2.57 1.87-.98 3.01H6.41l-.98-3.01zM8 3.6 5.15 1.61h5.7zM12.18 6.64l1.02-3.32 1.76 5.41zM10.59 11.56l3.47-.06-4.6 3.35zM5.41 11.56l1.13 3.29-4.6-3.35zM3.82 6.64 1.04 8.73l1.76-5.41z"/>` +
    `<path stroke="currentColor" stroke-width="1" d="M8 5.3V3.6M10.57 7.17l1.61-.53M9.59 10.18l1 1.38M6.41 10.18l-1 1.38M5.43 7.17l-1.61-.53"/>` +
    `<circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/>` +
    (crossed ? `<path d="M2.5 13.5 13.5 2.5" stroke="#D6280F" stroke-width="1.8" stroke-linecap="round"/>` : "") +
    `</svg>`;
}

function eventIcon(type) {
  switch (type) {
    case "goal": case "pen": return ballIcon("");
    case "own":     return ballIcon("ic--own");
    case "miss":    return ballIcon("ic--miss", true);
    case "yellow":  return `<i class="ic-card ic-card--y" aria-hidden="true"></i>`;
    case "red":     return `<i class="ic-card ic-card--r" aria-hidden="true"></i>`;
    case "yellow2": return `<i class="ic-card ic-card--yr" aria-hidden="true"></i>`;
    case "sub":     return IC_SUB;
    case "var":     return `<i class="ic-var" aria-hidden="true">VAR</i>`;
  }
  return "";
}

const reasonText = (c) => t().mp.reason[String(c || "").trim().toLowerCase()] || "";

function varText(raw) {
  const V = t().mp.var, d = String(raw || "").toLowerCase();
  const why = d.includes("offside") ? V.offside : d.includes("hand") ? V.handball : d.includes("foul") ? V.foul : "";
  const what = d.includes("goal") ? (/cancel|disallow/.test(d) ? V.goalOff : V.goalOn)
    : d.includes("penalty") ? (/cancel/.test(d) ? V.penOff : V.penOn)
    : d.includes("card") ? V.card : V.check;
  return why ? `${what} (${why})` : what;
}

function mpNotice(title, text, retry) {
  return `<div class="notice mp-notice"><b>${esc(title)}</b>${esc(text)}${
    retry ? `<br><button data-mp-retry>${esc(t().retry)}</button>` : ""}</div>`;
}

function mpHeadHTML(m, d) {
  const L = t(), M = L.mp;
  const plateOf = (a, b, cls) =>
    `<div class="screen ${cls}"><span class="num">${a}</span><span class="sep">:</span><span class="num">${b}</span></div>`;
  let plate, status;
  if (m.live) {
    plate = plateOf(m.homeScore ?? 0, m.awayScore ?? 0, "screen--live");
    status = `<span class="mp-status mp-status--live"><span class="dot-live"></span>${esc(cap(L.live))}</span>`;
  } else if (m.homeScore !== null) {
    plate = plateOf(m.homeScore, m.awayScore, "screen--final");
    status = `<span class="mp-status">${esc(M.finished)}</span>`;
  } else {
    plate = `<div class="screen"><span class="clock">${esc(fmtTime(m.date))}</span></div>`;
    status = `<span class="mp-status">${esc(m.postponed ? M.postponed : M.notStarted)}</span>`;
  }
  const when = m.date ? `${fmtDay(m.date)}, ${fmtTime(m.date)}` : L.tbd;
  const team = (name, badge) =>
    `<div class="mp-team">${badgeHTML(badge, name)}<span class="mp-team-name">${esc(clubName(name))}</span></div>`;
  return `<div class="mp-score">
      ${team(m.home, m.homeBadge)}
      <div class="mp-center">${plate}${status}<span class="mp-when">${esc(when)}</span></div>
      ${team(m.away, m.awayBadge)}
    </div>${d ? scorersHTML(m, d) : ""}`;
}

// Кто забил — коротко, под своей командой. Дубль одного игрока — одной строкой
function scorersHTML(m, d) {
  const M = t().mp;
  const goals = d.events.filter((e) => GOAL_TYPES.includes(e.type));
  const side = (s) => {
    const by = new Map();
    for (const g of goals) {
      if (g.side !== s) continue;
      const key = `${g.player}|${g.type === "own"}`;
      if (!by.has(key)) by.set(key, { name: g.player, own: g.type === "own", mins: [] });
      by.get(key).mins.push(`${g.min ?? "?"}'${g.type === "pen" ? ` (${M.penShort})` : ""}`);
    }
    return [...by.values()].map((x) => {
      const ic = ballIcon(x.own ? "ic--own" : "");
      const text = `<b>${esc(x.name || "—")}</b> ${esc(x.mins.join(", "))}${x.own ? ` (${esc(M.ownGoal)})` : ""}`;
      return `<li>${s === "home" ? text + ic : ic + text}</li>`;
    }).join("");
  };
  const total = (m.homeScore ?? 0) + (m.awayScore ?? 0);
  // Если ключ отдал не все события, честно говорим, сколько голов известно
  const short = m.homeScore !== null && goals.length < total
    ? `<p class="mp-known">${esc(M.goalsKnown(goals.length, total))}</p>` : "";
  if (!goals.length && !short) return "";
  return `<div class="mp-scorers"><ul class="mp-sc mp-sc--home">${side("home")}</ul>` +
         `<ul class="mp-sc mp-sc--away">${side("away")}</ul>${short}</div>`;
}

function eventWho(e) {
  const M = t().mp;
  let main = e.player, note = "";
  switch (e.type) {
    case "goal":    note = e.other ? M.assist(e.other) : ""; break;
    case "pen":     note = M.penalty; break;
    case "own":     note = M.ownGoal; break;
    case "miss":    note = M.missed; break;
    case "yellow":  note = reasonText(e.comment); break;
    case "yellow2": note = [M.secondYellow, reasonText(e.comment)].filter(Boolean).join(", "); break;
    case "red":     note = [M.sentOff, reasonText(e.comment)].filter(Boolean).join(", "); break;
    case "sub":     main = e.other || e.player; note = e.other && e.player ? M.subFor(e.player) : ""; break;
    case "var":     main = e.player || "VAR"; note = varText(e.detail); break;
  }
  return `<span class="tl-who"><b>${esc(main || "—")}</b>${note ? `<small>${esc(note)}</small>` : ""}</span>`;
}

function eventRowHTML(e, score) {
  const label = t().mp.kind[e.type] || "";
  const ic = `<span class="tl-ic" title="${esc(label)}">${eventIcon(e.type)}<span class="sr">${esc(label)}</span></span>`;
  const who = eventWho(e);
  const goal = GOAL_TYPES.includes(e.type);
  return `<div class="tl-row${goal ? " tl-row--goal" : ""}">
    <span class="tl-min"><b>${e.min === null ? "—" : esc(e.min + "'")}</b>${score ? `<span>${esc(score)}</span>` : ""}</span>
    <div class="tl-ev tl-ev--${e.side}">${e.side === "home" ? who + ic : ic + who}</div>
  </div>`;
}

const markHTML = (label, score) =>
  `<div class="tl-row tl-row--mark"><span class="tl-mark">${esc(label)}${score ? `<b>${esc(score)}</b>` : ""}</span></div>`;

// Ход матча: события нанизаны на нить по минутам, хозяева слева, гости справа
function timelineHTML(m, d) {
  const M = t().mp;
  const cut = d.cut.events && tsdbFree() ? `<p class="hint">${esc(M.cutEvents)}</p>` : "";
  if (!d.events.length) {
    return (m.finished || m.live)
      ? mpNotice(M.noEventsTitle, M.noEventsText) + cut
      : mpNotice(M.notStarted, M.notStartedText);
  }
  const list = d.events.slice().sort((a, b) => (a.min ?? 999) - (b.min ?? 999) || a.i - b.i);
  const rows = [markHTML(M.kickoff)];
  let h = 0, a = 0, ht = false;
  for (const e of list) {
    if (!ht && e.min !== null && e.min > 45) { rows.push(markHTML(M.halfTime, `${h}:${a}`)); ht = true; }
    let score = "";
    if (GOAL_TYPES.includes(e.type)) { if (e.side === "home") h++; else a++; score = `${h}:${a}`; }
    rows.push(eventRowHTML(e, score));
  }
  if (m.live) {
    rows.push(markHTML(cap(t().live)));
  } else if (m.finished && !cut) {
    // Финальный свисток ставим, только когда видим матч целиком
    if (!ht) rows.push(markHTML(M.halfTime, `${h}:${a}`));
    rows.push(markHTML(M.fullTime, m.homeScore !== null ? `${m.homeScore}:${m.awayScore}` : ""));
  }
  return `<div class="tl">${rows.join("")}</div>${cut}`;
}

const STAT_ORDER = ["ball possession", "expected_goals", "total shots", "shots on goal", "shots off goal",
  "blocked shots", "shots insidebox", "shots outsidebox", "corner kicks", "offsides", "fouls",
  "free kicks", "yellow cards", "red cards", "goalkeeper saves", "total passes", "passes accurate",
  "passes %", "goals_prevented"];

function statsHTML(d) {
  const M = t().mp;
  if (!d.stats.length) return mpNotice(M.noStatsTitle, M.noStatsText);
  const rank = (k) => { const i = STAT_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  const clamp = (w) => Math.max(0, Math.min(100, w));
  const rows = d.stats.slice().sort((x, y) => rank(x.key) - rank(y.key)).map((s) => {
    const sum = s.h + s.a;
    const hw = sum > 0 ? clamp(s.h / sum * 100) : 0;
    const aw = sum > 0 ? clamp(s.a / sum * 100) : 0;
    const lead = s.h > s.a ? "home" : s.a > s.h ? "away" : "";
    const val = (v, side) => `<span class="st-val${lead === side ? " st-val--lead" : ""}">${esc(v)}</span>`;
    const bar = (w, side) => `<span class="st-bar${side === "home" ? " st-bar--home" : ""}">` +
      `<i${lead === side ? ' class="lead"' : ""} style="width:${w.toFixed(1)}%"></i></span>`;
    return `<div class="st-row">
      <div class="st-head">${val(s.home, "home")}<span class="st-name">${esc(M.stat[s.key] || s.label)}</span>${val(s.away, "away")}</div>
      <div class="st-bars" aria-hidden="true">${bar(hw, "home")}${bar(aw, "away")}</div>
    </div>`;
  }).join("");
  const cut = d.cut.stats && tsdbFree() ? `<p class="hint">${esc(M.cutStats)}</p>` : "";
  return `<div class="st">${rows}</div>${cut}`;
}

// Пять игроков из сорока — это не состав, такую вкладку не показываем
function lineupsOk(d) {
  if (d.cut.lineups && tsdbFree()) return false;
  const { home, away } = d.lineups;
  return Math.max(home.start.length, away.start.length) >= 7;
}

// Что игрок сделал в матче — значки рядом с фамилией в составе
function playerMarks(events) {
  const marks = new Map();
  const add = (name, mark) => {
    if (!name) return;
    if (!marks.has(name)) marks.set(name, []);
    marks.get(name).push(mark);
  };
  for (const e of events) {
    if (e.type === "sub") { add(e.player, { type: "out", min: e.min }); add(e.other, { type: "in", min: e.min }); }
    else if (e.type !== "var") add(e.player, { type: e.type, min: e.min });
  }
  return marks;
}

function marksHTML(list) {
  if (!list || !list.length) return "";
  const M = t().mp;
  return `<span class="lu-ev">${list.map((k) => {
    const min = k.min === null ? "" : `${k.min}'`;
    if (k.type === "in" || k.type === "out") {
      return `<span class="lu-sub lu-sub--${k.type}" title="${esc(M.kind.sub)} ${esc(min)}">${k.type === "in" ? "▲" : "▼"}${esc(min)}</span>`;
    }
    return `<span class="tl-ic" title="${esc(M.kind[k.type] || "")} ${esc(min)}">${eventIcon(k.type)}</span>`;
  }).join("")}</span>`;
}

function playersHTML(list, marks) {
  const M = t().mp;
  if (!list.length) return `<p class="lu-empty">—</p>`;
  return `<ul class="lu-list">${list.map((p) => `
    <li class="lu-p">
      <span class="lu-num">${esc(p.num)}</span>
      <span class="lu-name">${esc(p.name)}${marksHTML(marks.get(p.name))}</span>
      <span class="lu-pos" title="${esc(M.posFull[p.line] || "")}">${esc(M.pos[p.line] || "")}</span>
    </li>`).join("")}</ul>`;
}

function lineupsHTML(m, d) {
  const M = t().mp;
  const marks = playerMarks(d.events);
  const col = (s, name, badge) => `
    <div class="lu-col">
      <h3 class="lu-team">${badgeHTML(badge, name)}<span>${esc(clubName(name))}</span>${
        s.formation ? `<span class="lu-form">${esc(s.formation)}</span>` : ""}</h3>
      <p class="lu-h">${esc(M.starting)}</p>
      ${playersHTML(s.start, marks)}
      ${s.bench.length ? `<p class="lu-h lu-h--bench">${esc(M.bench)}</p>${playersHTML(s.bench, marks)}` : ""}
    </div>`;
  return `<div class="lu">${col(d.lineups.home, m.home, m.homeBadge)}${col(d.lineups.away, m.away, m.awayBadge)}</div>`;
}

function mpFootHTML(m) {
  if (!m) return "";
  const M = t().mp, parts = [];
  if (m.video) {
    parts.push(`<a class="mp-video" href="${esc(m.video)}" target="_blank" rel="noopener noreferrer">${IC_PLAY}${esc(M.video)}</a>`);
  }
  if (m.venue) parts.push(`<span class="mp-venue">${IC_PIN}${esc(m.venue)}</span>`);
  return parts.length ? `<div class="mp-foot">${parts.join("")}</div>` : "";
}

let mp = null;   // открытое окно: { id, tab, match, data, error, loading }

function renderMatchPanel() {
  if (!mp) return;
  const L = t(), M = L.mp, m = mp.match, d = mp.data;
  const leagueName = (m && (L.league[m.leagueId] || m.leagueName)) || L.league[state.league.id];
  const stage = m ? stageLabel(m.stage) : null;
  const eyebrow = [leagueName, stage && stage.full].filter(Boolean).join(" · ");

  let tabs = "", body;
  if (mp.loading) {
    body = `<div class="mp-skel">${'<div class="skel"></div>'.repeat(4)}</div>`;
  } else if (mp.error) {
    body = mpNotice(M.failTitle, describeErr(mp.error), true);
  } else if (d.demo) {
    body = mpNotice(L.demoTitle, M.demo);
  } else if (d.unsupported) {
    body = mpNotice(M.failTitle, M.unsupported);
  } else {
    const avail = ["events"];
    if (d.stats.length) avail.push("stats");
    if (lineupsOk(d)) avail.push("lineups");
    if (!avail.includes(mp.tab)) mp.tab = "events";
    if (avail.length > 1) {
      tabs = `<div class="mp-tabs" role="tablist">${avail.map((k) =>
        `<button role="tab" data-mtab="${k}" aria-selected="${k === mp.tab}">${esc(M.tabs[k])}</button>`).join("")}</div>`;
    }
    body = mp.tab === "stats" ? statsHTML(d) : mp.tab === "lineups" ? lineupsHTML(m, d) : timelineHTML(m, d);
  }

  // Фокус переживает перерисовку — иначе после фонового обновления он падает на страницу
  const active = document.activeElement;
  const refocus = active && active.dataset && active.dataset.mtab ? `[data-mtab="${active.dataset.mtab}"]`
    : active && active.hasAttribute && active.hasAttribute("data-mp-close") ? "[data-mp-close]" : null;

  $("#mp-content").innerHTML = `
    <div class="mp-top">
      <span class="mp-eyebrow">${esc(eyebrow)}</span>
      <button class="mp-close" data-mp-close aria-label="${esc(M.close)}" title="${esc(M.close)}">${IC_X}</button>
    </div>
    ${m ? mpHeadHTML(m, d && d.events ? d : null) : ""}
    ${tabs}
    <div class="mp-body"${tabs ? ' role="tabpanel"' : ""}>${body}</div>
    ${mpFootHTML(m)}`;

  $(".mp-box").setAttribute("aria-label", m ? `${clubName(m.home)} — ${clubName(m.away)}` : M.open);
  if (refocus) { const el = $("#mp-content").querySelector(refocus); if (el) el.focus(); }
}

/* ---------- Панель ключей ----------
   Правка файла и перезаливка на хостинг — долгий цикл, в котором легко
   ошибиться. Здесь ключ можно проверить прямо на странице за секунду. */

function keysOpen(open) {
  const L = t();
  const box = $("#keys");
  box.hidden = !open;
  if (!open) return;
  $("#k-title").textContent = L.keysTitle;
  $("#k-hint").textContent = L.keysHint;
  $("#k-test").textContent = L.keysCheck;
  $("#k-forget").textContent = L.keysForget;
  $("#k-close").textContent = L.keysClose;
  $("#k-fd").value = CONFIG.fdKey || "";
  $("#k-af").value = CONFIG.afKey || "";
  $("#k-px").value = CONFIG.fdProxy || "";
  $("#k-pxlab").childNodes[0].nodeValue = L.keysProxy;
  $("#k-result").innerHTML = "";
}

function keyLine(name, ok, text) {
  const mark = ok === null ? "…" : ok ? "✓" : "✗";
  const cls = ok === null ? "" : ok ? "k-ok" : "k-bad";
  return `<div class="k-line ${cls}"><b>${mark}</b> <span>${esc(name)}</span> — ${esc(text)}</div>`;
}

function describeErr(e) {
  const L = t();
  if (!e || !e.kind) return String(e && e.message || "ошибка");
  const base = L.err[e.kind] || e.kind;
  return base + (e.kind === "http" && e.detail ? ` ${e.detail}.` : "");
}

async function keysTest() {
  const L = t();
  const fd = $("#k-fd").value.trim();
  const af = $("#k-af").value.trim();
  const px = $("#k-px").value.trim();
  const out = $("#k-result");

  out.innerHTML = keyLine("football-data.org", null, L.keysTesting) +
                  keyLine("API-Football", null, L.keysTesting);

  CONFIG.fdKey = fd;
  CONFIG.afKey = af;
  CONFIG.fdProxy = px;
  store.set("fdKey", fd);
  store.set("afKey", af);
  store.set("fdProxy", px);
  cache.clear(); windowCache.clear(); afSeasonCache.clear(); afWindowTop = null; detailCache.clear();

  let fdLine, afLine;

  if (!fd && !px) {
    fdLine = keyLine("football-data.org", false, L.keysEmpty);
  } else {
    try {
      const d = await fdGet(`/competitions/PL/standings`);
      const n = (d.standings || []).find((b) => b.type === "TOTAL")?.table?.length || 0;
      const how = px ? ` (${L.keysViaProxy})` : "";
      fdLine = keyLine("football-data.org", n > 5, `${L.keysOk}${how}, ${n} ${L.keysRows}`);
    } catch (e) { fdLine = keyLine("football-data.org", false, describeErr(e)); }
  }

  if (!af) {
    afLine = keyLine("API-Football", false, L.keysEmpty);
  } else {
    try {
      const d = await afGet(`/status`);
      const plan = d.response?.subscription?.plan || "?";
      const used = d.response?.requests?.current ?? "?";
      const max  = d.response?.requests?.limit_day ?? "?";
      afLine = keyLine("API-Football", true, `${L.keysOk}, ${L.keysPlan}: ${plan} (${used}/${max})`);
    } catch (e) { afLine = keyLine("API-Football", false, describeErr(e)); }
  }

  // Отдельно проверяем бомбардиров: у football-data.org это может быть платно
  let scLine = "";
  if (fd || px) {
    try {
      const d = await fdGet(`/competitions/PL/scorers?limit=5`);
      const list = d.scorers || [];
      const withA = list.some((r) => r.assists !== null && r.assists !== undefined);
      scLine = keyLine(L.keysScorers, list.length > 0,
        list.length
          ? `${list.length} ${L.keysPlayers}, ${L.keysAssists}: ${withA ? L.keysYes : L.keysNo}`
          : L.keysEmptyList);
    } catch (e) { scLine = keyLine(L.keysScorers, false, describeErr(e)); }
  }

  out.innerHTML = fdLine + scLine + afLine;

  // Провайдер выбираем сам: если рабочего ключа football-data.org нет,
  // но есть API-Football — переключаемся на него
  if (!fd && !px && af) CONFIG.provider = "apifootball";
  load();
}

/* ---------- Состояние в адресе страницы ----------
   Вид записывается в хвост адреса после #, поэтому F5 возвращает
   ровно туда же, где ты был. Заодно ссылкой можно поделиться.
   Используем replaceState, чтобы не засорять историю браузера. */

function hashParts() {
  const parts = [state.lang, state.sport.id, state.league.id, state.view];
  if (state.view === "round" && state.round) parts.push(state.round);
  if (state.view === "cal" && state.calDay) parts.push(isoKey(state.calDay));
  if (state.view === "players") parts.push(state.playerKind);
  return parts;
}

/* Открытый матч дописывается хвостом: #ru/football/4328/results/match/2494042.
   Номер матча проверяем по шаблону: он попадает в адрес и в селекторы. */
const MATCH_ID = /^[\w-]{1,40}$/;
const baseHash = () => "#" + hashParts().join("/");
const matchHref = (id) => `${baseHash()}/match/${id}`;

function writeHash() {
  const h = state.matchId ? matchHref(state.matchId) : baseHash();
  if (location.hash !== h) {
    try { history.replaceState(null, "", h); } catch (e) { location.hash = h; }
  }
}

function splitHash() {
  const raw = (location.hash || "").replace(/^#/, "").trim();
  const parts = raw ? raw.split("/") : [];
  const i = parts.indexOf("match");
  const id = i >= 0 ? parts[i + 1] || "" : "";
  return { base: i >= 0 ? parts.slice(0, i) : parts, matchId: MATCH_ID.test(id) ? id : null };
}

function applyHash() {
  const { base, matchId } = splitHash();
  state.matchId = matchId;
  if (!base.length) return;
  const [lang, sportId, leagueId, view, extra] = base;

  if (I18N[lang]) state.lang = lang;

  const sport = SPORTS.find((s) => s.id === sportId);
  if (!sport) return;                       // мусор в адресе — остаёмся на умолчаниях
  state.sport = sport;
  state.league = sport.leagues.find((l) => l.id === leagueId) || sport.leagues[0];
  state.view = sport.views.includes(view) ? view : sport.views[0];

  if (state.view === "round") {
    const n = Number(extra);
    if (Number.isFinite(n) && n >= 1 && n <= 60) state.round = n;
  }
  if (state.view === "cal" && /^\d{4}-\d{2}-\d{2}$/.test(extra || "")) {
    const [y, m, d] = extra.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    if (!isNaN(dt)) { state.calDay = dt; state.calMonth = startOfMonth(dt); }
  }
  if (state.view === "players" && (extra === "goals" || extra === "assists")) {
    state.playerKind = extra;
  }
}

/* ============================================================
   9. КОНТРОЛЛЕР
   ============================================================ */

let loadToken = 0;

// Индекс «в какие дни есть матчи» — нужен для точек в календаре
function indexDays(items) {
  for (const m of items) {
    if (!m.date) continue;
    const k = isoKey(m.date);
    if (!state.dayIndex.has(k)) state.dayIndex.set(k, new Set());
    state.dayIndex.get(k).add(m.id);
  }
}

// Текущий тур — тот, к которому относится ближайший к сегодня матч
function guessRound(items) {
  const now = Date.now();
  let best = null, bestDist = Infinity;
  for (const m of items) {
    if (!m.stage || (m.stage.kind !== "matchday" && m.stage.kind !== "leaguePhase")) continue;
    const dist = Math.abs(m.ts - now);
    if (dist < bestDist) { bestDist = dist; best = m.stage.n; }
  }
  return best ?? 1;
}

async function load() {
  const token = ++loadToken;
  const { sport, league, view } = state;

  state.lastError = null;
  writeHash();
  renderChrome();
  $("#content").innerHTML = skeleton();

  try {
    if (view === "players")   await viewPlayers(token);
    else if (view === "round") await viewRound(token);
    else if (view === "cal")  await viewCalendar(token);
    else if (view === "table") await viewTable(token);
    else                      await viewList(token);
  } catch (err) {
    if (token === loadToken) $("#content").innerHTML = notice(t().emptyTitle, t().emptyText, true);
  }
}

const done = (token) => token === loadToken;

function finish(token, failed, html) {
  if (!done(token)) return false;
  writeHash();                     // тур мог определиться уже после старта загрузки
  state.usedDemo = failed;
  renderChrome();
  $("#content").innerHTML = html;
  return true;
}

/* ---------- Результаты и расписание ---------- */

async function viewList(token) {
  const { sport, league, view } = state;
  let data, failed = false;
  try {
    data = view === "results" ? await loadResults(league, sport) : await loadSchedule(league, sport);
    if (!data || !data.length) throw new Error("empty");
    indexDays(data);
  } catch (e) {
    failed = true;
    state.lastError = e;
    data = demoFor(sport, league, view);
  }

  const q = state.query.trim().toLowerCase();
  const filtered = q
    ? data.filter((m) => `${m.home} ${m.away} ${m.title} ${clubName(m.home)} ${clubName(m.away)}`
        .toLowerCase().includes(q))
    : data;

  finish(token, failed, renderList(filtered, sport, view !== "results"));
}

/* ---------- Турнирная таблица ---------- */

async function viewTable(token) {
  const { sport, league } = state;
  let rows = [], failed = false;
  try {
    rows = await loadTable(league, sport);
  } catch (e) {
    failed = true;
    state.lastError = e;
    rows = demoTable(league.id);
  }
  finish(token, failed, renderTable(rows));
}

/* ---------- Бомбардиры и ассистенты ---------- */

async function viewPlayers(token) {
  const { sport, league } = state;
  let rows = [], failed = false;
  try {
    rows = await loadPlayers(league, sport, state.playerKind);
    if (!rows.length) throw new Error("empty");
  } catch (e) {
    failed = true;
    state.lastError = e;
    rows = demoPlayers(league.id, state.playerKind);
  }
  finish(token, failed, renderPlayers(rows));
}

/* ---------- Все матчи одного тура ---------- */

async function viewRound(token) {
  const { sport, league } = state;

  // Первый заход: узнаём, какой тур сейчас актуален
  if (state.round === null) {
    let around = [];
    try { around = await loadAround(league, sport); } catch (e) { /* подстрахуемся демо */ }
    if (!done(token)) return;
    if (!around.length) {
      around = demoFor(sport, league, "results").concat(demoFor(sport, league, "schedule"));
      demoLeagues.add(cacheKeyFor(league));
      state.lastError = state.lastError || new ApiError("empty", "loadAround");
    }
    indexDays(around);
    roundCache.set(cacheKeyFor(league), around);
    state.round = guessRound(around);
  }

  const n = state.round;
  let data = [], failed = false;
  try {
    data = await loadRound(league, sport, n);
    if (!data.length) throw new Error("empty");
    indexDays(data);
  } catch (e) {
    // Подстраховка: сначала из уже загруженных матчей, иначе — демо-тур целиком
    const pool = roundCache.get(cacheKeyFor(league)) || [];
    data = pool.filter((m) => m.stage && m.stage.n === n);
    if (!data.length) { data = demoRound(league.id, n); failed = true; state.lastError = e; }
    else failed = demoLeagues.has(cacheKeyFor(league));
  }
  if (!done(token)) return;

  const body = data.length
    ? renderList(data.sort((a, b) => a.ts - b.ts), sport, false, true)
    : notice(t().noRoundTitle, t().noRoundText);

  finish(token, failed, roundNavHTML(n) + body);
}

const roundCache = new Map();
const demoLeagues = new Set();   // для каких лиг пул собран из демо-данных
const cacheKeyFor = (league) => `${league.id}:${league.season}`;

/* ---------- Календарь ---------- */

async function viewCalendar(token) {
  const { sport, league } = state;
  if (!state.calDay) state.calDay = new Date();

  // Подтягиваем ближайшие матчи, чтобы проставить точки на числах
  const key = cacheKeyFor(league);
  if (!roundCache.has(key)) {
    try {
      const around = await loadAround(league, sport);
      if (!done(token)) return;
      if (!around.length) throw new Error("empty");
      indexDays(around);
      roundCache.set(key, around);
    } catch (e) {
      state.lastError = e;
      const demo = demoFor(sport, league, "results").concat(demoFor(sport, league, "schedule"));
      indexDays(demo);
      roundCache.set(key, demo);
      demoLeagues.add(key);
    }
  }
  let failed = demoLeagues.has(key);

  // Матчи выбранного дня
  let day = [];
  try {
    day = await loadDay(league, sport, state.calDay);
  } catch (e) { /* дальше возьмём из локальных */ }
  if (!done(token)) return;

  if (!day.length) {
    const pool = roundCache.get(key) || [];
    day = pool.filter((m) => m.date && sameDay(m.date, state.calDay));
  }
  indexDays(day);

  const head = `<h2 class="dayhead dayhead--cal">${esc(fmtDay(state.calDay))}${
    sameDay(state.calDay, new Date()) ? ` · ${esc(t().today)}` : ""}</h2>`;

  const body = day.length
    ? renderList(day.sort((a, b) => a.ts - b.ts), sport, false, true)
    : notice(t().noDayTitle, t().noDayText);

  finish(token, failed, calendarHTML() + head + body);
}

function setLang(code) {
  if (!I18N[code] || code === state.lang) return;
  state.lang = code;
  load();
}

function setSport(id) {
  const sport = SPORTS.find((s) => s.id === id);
  if (!sport || sport.id === state.sport.id) return;
  state.sport = sport;
  state.league = sport.leagues[0];
  state.round = null;
  state.dayIndex.clear();
  roundCache.clear(); demoLeagues.clear();
  if (!sport.views.includes(state.view)) state.view = sport.views[0];
  load();
}

function setLeague(id) {
  const league = state.sport.leagues.find((l) => l.id === id);
  if (!league || league.id === state.league.id) return;
  state.league = league;
  state.round = null;
  state.dayIndex.clear();
  roundCache.clear(); demoLeagues.clear();
  state.seasonShift = null;
  load();
}

function setView(id) {
  if (id === state.view) return;
  state.view = id;
  load();
}

/* ---------- Окно матча: открыть, загрузить, закрыть ----------
   Карточка матча — обычная ссылка на …/match/<id>. Переход по ней
   добавляет шаг в историю, поэтому «назад» в браузере и на телефоне
   закрывает окно. Открытое по ссылке извне окно закрывается без
   шага назад — иначе посетитель ушёл бы с сайта. */

let mpToken = 0;
let mpFromList = false;     // открыто кликом по карточке: «закрыть» = шаг назад
let mpReturn = null;        // куда вернуть фокус после закрытия

function openMatchPanel(id) {
  const box = $("#mp");
  if (mp && mp.id === id && !box.hidden) { renderMatchPanel(); return; }
  if (box.hidden) {
    mpReturn = document.activeElement;
    box.hidden = false;
    document.body.classList.add("mp-open");
  } else {
    // Матч сменили прямо в адресе, а не кликом: шаг назад вернул бы прошлый матч
    mpFromList = false;
  }
  mp = { id, tab: "events", match: matchIndex.get(id) || null, data: null, error: null, loading: true };
  renderMatchPanel();
  $(".mp-box").scrollTop = 0;
  $(".mp-box").focus({ preventScroll: true });
  fetchMatchPanel(false);
}

async function fetchMatchPanel(force) {
  if (!mp) return;
  const token = ++mpToken, id = mp.id;
  const src = mp.match ? mp.match.src
    : id.startsWith("demo-") ? "demo" : useApiFootball(state.sport) ? "af" : "tsdb";
  if (src !== "tsdb") {
    mp.data = src === "demo" ? { demo: true } : { unsupported: true };
    mp.loading = false;
    renderMatchPanel();
    return;
  }
  try {
    const data = await matchDetails(id, mp.match, force);
    if (token !== mpToken || !mp || mp.id !== id) return;
    mp.data = data;
    mp.match = data.match;
    mp.error = null;
  } catch (e) {
    if (token !== mpToken || !mp || mp.id !== id) return;
    if (!mp.data) mp.error = e;           // при фоновом обновлении старое не стираем
  }
  mp.loading = false;
  renderMatchPanel();
}

function closeMatchPanel(fromHash) {
  const box = $("#mp");
  if (box.hidden) return;
  if (!fromHash && mpFromList) {
    mpFromList = false;
    history.back();                       // окно спрячет обработчик hashchange
    return;
  }
  const id = mp && mp.id;
  mp = null; mpToken++; mpFromList = false;
  box.hidden = true;
  document.body.classList.remove("mp-open");
  if (!fromHash) { state.matchId = null; writeHash(); }
  const card = id && document.querySelector(`a.match[data-mid="${id}"]`);
  const back = card || (mpReturn && document.contains(mpReturn) ? mpReturn : null);
  if (back && back.focus) back.focus({ preventScroll: true });
}

// Открыть или закрыть окно по тому, что сейчас записано в адресе
function syncMatchPanel() {
  if (state.matchId && state.sport.kind !== "match") { state.matchId = null; writeHash(); }
  if (state.matchId) openMatchPanel(state.matchId);
  else closeMatchPanel(true);
}

$("#keysbtn").addEventListener("click", () => keysOpen(true));
$("#k-close").addEventListener("click", () => keysOpen(false));
$("#k-test").addEventListener("click", keysTest);
$("#k-forget").addEventListener("click", () => {
  ["fdKey", "afKey", "fdProxy"].forEach((k) => store.set(k, ""));
  CONFIG.fdKey = CONFIG.afKey = CONFIG.fdProxy = "";
  CONFIG.provider = "thesportsdb";
  $("#k-fd").value = $("#k-af").value = $("#k-px").value = "";
  $("#k-result").innerHTML = "";
  cache.clear(); windowCache.clear(); afSeasonCache.clear(); afWindowTop = null; detailCache.clear();
  load();
});
$("#keys").addEventListener("click", (e) => { if (e.target.id === "keys") keysOpen(false); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("#mp").hidden) closeMatchPanel(); else keysOpen(false);
});

// Окно матча: крестик, клик мимо окна, вкладки, повтор после ошибки
$("#mp").addEventListener("click", (e) => {
  if (e.target === e.currentTarget || e.target.closest("[data-mp-close]")) { closeMatchPanel(); return; }
  const tab = e.target.closest("[data-mtab]");
  if (tab && mp) { mp.tab = tab.dataset.mtab; renderMatchPanel(); return; }
  if (e.target.closest("[data-mp-retry]") && mp) {
    mp.loading = true; mp.error = null;
    renderMatchPanel();
    fetchMatchPanel(true);
  }
});

// Tab не уводит фокус из открытого окна на страницу под ним
document.addEventListener("keydown", (e) => {
  if (e.key !== "Tab" || $("#mp").hidden) return;
  const box = $(".mp-box");
  const items = [...box.querySelectorAll("button, a[href]")].filter((el) => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

$("#langsw").addEventListener("click", (e) => {
  const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang);
});
$("#sportnav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-sport]"); if (b) setSport(b.dataset.sport);
});
$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-league]"); if (b) setLeague(b.dataset.league);
});
$("#viewtabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view);
});
$("#content").addEventListener("click", (e) => {
  // Карточка матча — ссылка: окно откроет смена адреса. Здесь только
  // помечаем, что открыли из списка. С Ctrl/Cmd ссылка уходит в новую вкладку
  if (e.target.closest("a.match")) {
    if (e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) mpFromList = true;
    return;
  }

  if (e.target.closest("[data-retry]")) { cache.clear(); load(); return; }

  const pk = e.target.closest("[data-pk]");
  if (pk) {
    if (pk.dataset.pk !== state.playerKind) { state.playerKind = pk.dataset.pk; load(); }
    return;
  }

  const rb = e.target.closest("[data-round]");
  if (rb) {
    const next = state.round + (rb.dataset.round === "next" ? 1 : -1);
    if (next >= 1 && next <= 60) { state.round = next; load(); }
    return;
  }

  const mb = e.target.closest("[data-month]");
  if (mb) {
    const d = state.calMonth;
    state.calMonth = new Date(d.getFullYear(), d.getMonth() + (mb.dataset.month === "next" ? 1 : -1), 1);
    load();
    return;
  }

  const db = e.target.closest("[data-day]");
  if (db) {
    const [y, m, d] = db.dataset.day.split("-").map(Number);
    state.calDay = new Date(y, m - 1, d);
    load();
  }
});

let searchTimer;
$("#search").addEventListener("input", (e) => {
  state.query = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 220);
});

$("#refresh").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  cache.clear(); windowCache.clear();
  btn.classList.add("is-busy");
  await load();
  btn.classList.remove("is-busy");
});

setInterval(() => {
  if (document.hidden) return;
  if (state.view !== "table") { cache.clear(); windowCache.clear(); load(); }
  // Открытый матч, который идёт или вот-вот начнётся, обновляем тоже
  const m = mp && mp.match;
  if (m && !m.finished && Math.abs(m.ts - Date.now()) < 4 * 3_600_000) fetchMatchPanel(true);
}, 120_000);

/* Смена адреса вручную, переход по ссылке или кнопка «назад».
   Наш writeHash работает через replaceState и это событие не вызывает,
   так что зациклиться здесь нельзя. Если поменялся только матч в хвосте
   адреса, список не перезагружаем — открываем или закрываем окно. */
window.addEventListener("hashchange", () => {
  const { base, matchId } = splitHash();
  if (base.join("/") === hashParts().join("/")) {
    state.matchId = matchId;
  } else {
    applyHash();
    load();
  }
  syncMatchPanel();
});

applyHash();
load();
syncMatchPanel();

</script>
</body>
