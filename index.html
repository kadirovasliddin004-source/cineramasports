<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2B417">
<title>CineramaSports — результаты и расписание: футбол, UFC, Формула-1</title>
<meta name="description" content="Результаты матчей и расписание: Лига чемпионов, АПЛ, Ла Лига, Серия А, Бундеслига, Лига 1, UFC и Формула-1.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CineramaSports — дизайн-токены
   Направление: программка матчевого дня — тёплая белая бумага
   с золотым тиснением. Результат «отчеканен» в золоте,
   ещё не сыгранный матч — только контур.
   ============================================================ */
:root{
  --paper:      #FFFFFF;   /* карточки */
  --sand:       #FAF6EC;   /* бумага фона */
  --ink:        #191510;   /* текст, тёплый почти-чёрный */
  --muted:      #6E6552;   /* второстепенный текст */
  --gold:       #F2B417;   /* заливки, активные состояния */
  --gold-deep:  #9A6B04;   /* золото для текста по белому */
  --gold-soft:  #FDF0CC;   /* подложки */
  --gold-edge:  #D99A08;   /* кромка тиснения */
  --live:       #D6280F;   /* идёт прямо сейчас */
  --line:       rgba(25,21,16,.10);
  --line-2:     rgba(25,21,16,.20);
  --shadow:     0 1px 2px rgba(93,66,8,.07), 0 6px 18px -10px rgba(93,66,8,.22);
  --shadow-up:  0 2px 4px rgba(93,66,8,.09), 0 14px 28px -14px rgba(93,66,8,.30);

  --r-sm: 6px;
  --r:    12px;
  --r-lg: 18px;

  --pad: clamp(14px, 3vw, 28px);

  --font-display: 'Unbounded', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(980px 460px at 50% -14%, rgba(242,180,23,.30), transparent 66%),
    var(--sand);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}

:focus-visible{
  outline:2px solid var(--gold-deep);
  outline-offset:2px;
  border-radius:var(--r-sm);
}

.wrap{max-width:980px;margin:0 auto;padding:0 var(--pad)}

/* ============================================================
   Шапка
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex;align-items:center;gap:clamp(12px,3vw,32px);
  height:64px;
}
.brand{
  display:flex;align-items:center;gap:9px;
  font-family:var(--font-display);font-weight:800;
  font-size:17px;letter-spacing:.06em;
  white-space:nowrap;
}
/* медаль */
.brand-lamp{
  width:13px;height:13px;border-radius:50%;
  background:linear-gradient(150deg,#FFDD6E,var(--gold) 50%,var(--gold-edge));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.75), 0 1px 3px rgba(154,107,4,.4);
  flex:none;
}

.sportnav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.sportnav::-webkit-scrollbar{display:none}
.sportnav button{
  position:relative;
  padding:8px 14px;
  font-weight:600;font-size:14px;
  color:var(--muted);
  border-radius:var(--r-sm);
  white-space:nowrap;
  transition:color .18s ease;
}
.sportnav button:hover{color:var(--ink)}
.sportnav button[aria-selected="true"]{color:var(--ink)}
.sportnav button[aria-selected="true"]::after{
  content:'';position:absolute;left:12px;right:12px;bottom:-1px;
  height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold-edge));
}

.icon-btn{
  flex:none;width:36px;height:36px;
  display:grid;place-items:center;
  background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--muted);
  transition:color .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.icon-btn:hover{color:var(--gold-deep);border-color:var(--gold);box-shadow:var(--shadow)}
.icon-btn.is-busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}


/* переключатель языка */
.langsw{
  display:flex;flex:none;gap:2px;
  background:var(--paper);
  border:1px solid var(--line);border-radius:100px;
  padding:2px;
}
.langsw button{
  padding:5px 11px;border-radius:100px;
  font-family:var(--font-data);font-size:11px;font-weight:700;
  letter-spacing:.05em;color:var(--muted);
  transition:all .18s ease;
}
.langsw button:hover{color:var(--ink)}
.langsw button[aria-pressed="true"]{
  background:linear-gradient(160deg,#FFD75E,var(--gold) 55%,var(--gold-edge));
  color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}

/* короткое название стадии в рельсе — вместо номера тура */
.stagetag{
  display:block;
  font-family:var(--font-display);font-weight:700;
  font-size:11px;letter-spacing:.02em;
  color:var(--gold-deep);
  line-height:1.2;
  cursor:help;
}

/* ============================================================
   Заголовок раздела
   ============================================================ */
.hero{padding:clamp(24px,5vw,44px) 0 18px}
.hero-eyebrow{
  font-family:var(--font-data);
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);
  margin-bottom:10px;
}
.hero-title{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(28px,6vw,46px);
  line-height:1.02;letter-spacing:-.01em;
}
.hero-sub{color:var(--muted);margin-top:8px;max-width:56ch}

/* ============================================================
   Панель лиг / сезона
   ============================================================ */
.filters{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--line);
}
.chips{display:flex;gap:7px;min-width:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 14px;border-radius:100px;
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--muted);font-weight:600;font-size:13px;
  white-space:nowrap;
  transition:all .18s ease;
}
.chip:hover{color:var(--ink);border-color:var(--gold);box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{
  background:linear-gradient(160deg,#FFD75E,var(--gold) 55%,var(--gold-edge));
  border-color:var(--gold-edge);
  color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), var(--shadow);
}
.chip--static{
  border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep);
  cursor:default;font-family:var(--font-data);font-size:12px;
}

.spacer{flex:1 1 auto}

.search{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);
  border:1px solid var(--line);border-radius:100px;
  padding:6px 14px;min-width:190px;
  transition:border-color .18s ease;
}
.search:focus-within{border-color:var(--gold)}
.search input{background:none;border:none;outline:none;width:100%;font-size:13px}
.search input::placeholder{color:var(--muted)}
.search svg{flex:none;color:var(--muted)}

/* вкладки: результаты / расписание / таблица */
.viewtabs{
  display:flex;gap:26px;padding:18px 0 4px;
  overflow-x:auto;scrollbar-width:none;
}
.viewtabs::-webkit-scrollbar{display:none}
.viewtabs button{
  position:relative;flex:none;padding-bottom:10px;
  font-family:var(--font-display);font-weight:500;
  font-size:13px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);
  transition:color .18s ease;
}
.viewtabs button:hover{color:var(--ink)}
.viewtabs button[aria-selected="true"]{color:var(--ink)}
.viewtabs button[aria-selected="true"]::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold-edge));
}

/* ============================================================
   СИГНАТУРА: счёт как золотое тиснение
   Сыгранный матч получает золотую пластину, будущий — контур.
   ============================================================ */
.list{padding:18px 0 60px;display:flex;flex-direction:column;gap:9px}

.daygroup{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.daygroup:first-child{margin-top:0}
.dayhead{
  display:flex;align-items:center;gap:12px;
  font-family:var(--font-data);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
  margin:6px 0 10px;
}
.dayhead::after{content:'';flex:1;height:1px;background:var(--line)}

.match{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:0 16px;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:12px 16px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.match:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow-up)}
@media (prefers-reduced-motion:reduce){
  .match,.match:hover{transition:none;transform:none}
}

/* левый рельс: тур / раунд / этап */
.rail{
  font-family:var(--font-data);font-size:11px;font-weight:500;
  color:var(--muted);
  text-align:center;min-width:46px;
  border-right:1px solid var(--line);
  padding-right:14px;
  align-self:stretch;display:grid;place-content:center;
}
.rail b{display:block;font-size:16px;color:var(--gold-deep);font-weight:700;line-height:1.1}

.row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;
}

.side{display:flex;align-items:center;gap:10px;min-width:0}
.side--home{justify-content:flex-end;text-align:right}
.side--away{justify-content:flex-start;text-align:left}
.name{
  font-weight:600;font-size:14.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.badge{
  width:26px;height:26px;object-fit:contain;flex:none;
}
.badge-fallback{
  width:26px;height:26px;flex:none;border-radius:50%;
  background:var(--gold-soft);border:1px solid var(--line);
  display:grid;place-items:center;
  font-family:var(--font-data);font-size:10px;color:var(--gold-deep);
}

/* пластина счёта — базовое состояние: контур (матч ещё не сыгран) */
.screen{
  position:relative;overflow:hidden;
  background:var(--paper);
  border:1.5px solid var(--gold);
  border-radius:var(--r-sm);
  padding:7px 14px;min-width:88px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.screen .num{
  font-family:var(--font-display);font-weight:700;
  font-size:21px;line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.screen .sep{color:rgba(25,21,16,.42);font-size:17px;line-height:1}
.screen .clock{
  font-family:var(--font-data);font-weight:500;font-size:15px;
  color:var(--gold-deep);letter-spacing:.04em;
}
.screen .vs{
  font-family:var(--font-display);font-weight:700;font-size:13px;
  letter-spacing:.1em;color:var(--muted);
}


/* пластина счёта + дата под ней */
.scorebox{
  display:grid;justify-items:center;gap:4px;
}
.scoredate{
  font-family:var(--font-data);font-size:10.5px;
  color:var(--muted);letter-spacing:.02em;white-space:nowrap;
}

/* результат — золотое тиснение */
.screen--final{
  background:linear-gradient(160deg,#FFDD6E,var(--gold) 48%,var(--gold-edge));
  border-color:var(--gold-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 2px rgba(120,82,3,.18);
}
/* тонкая штриховка «шлифованного металла» */
.screen--final::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,
    rgba(255,255,255,.16) 0 1px, transparent 1px 4px);
}
.screen--final .num{color:#33240A;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.screen--final .sep{color:rgba(51,36,10,.5)}

/* идёт прямо сейчас */
.screen--live{
  background:var(--paper);
  border-color:var(--live);
}
.screen--live .num{color:var(--live)}
.screen--live .sep{color:rgba(214,40,15,.45)}

.foot{
  grid-column:2;
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
  font-family:var(--font-data);font-size:11px;color:var(--muted);
}
.tag{display:inline-flex;align-items:center;gap:5px}
.dot-live{
  width:6px;height:6px;border-radius:50%;background:var(--live);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}}
.tag--live{color:var(--live);font-weight:700}

/* карточка события (UFC / Формула-1) */
.event{
  display:grid;grid-template-columns:auto 1fr;gap:0 16px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.event:hover{border-color:var(--gold);box-shadow:var(--shadow-up)}
.event-title{
  font-family:var(--font-display);font-weight:500;
  font-size:16px;line-height:1.25;
}
.event-sub{color:var(--muted);font-size:13px;margin-top:4px}
.event-right{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;
}
.winner{color:var(--gold-deep);font-weight:700}

/* ============================================================
   Турнирная таблица
   ============================================================ */
.tablewrap{
  padding:18px 0 60px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
table{border-collapse:collapse;width:100%;min-width:620px}
thead th{
  font-family:var(--font-data);font-size:10.5px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  text-align:center;padding:0 8px 12px;
  border-bottom:1px solid var(--line-2);
}
thead th:nth-child(2){text-align:left}
tbody td{
  padding:11px 8px;text-align:center;
  border-bottom:1px solid var(--line);
  font-family:var(--font-data);font-size:13px;
  font-variant-numeric:tabular-nums;
}
tbody td:nth-child(2){
  text-align:left;font-family:var(--font-body);
  font-weight:600;font-size:14px;
}
tbody tr:hover{background:rgba(242,180,23,.07)}
.pos{
  display:inline-grid;place-items:center;
  width:24px;height:24px;border-radius:var(--r-sm);
  background:var(--paper);border:1px solid var(--line-2);
  font-weight:700;font-size:12px;
}
.pos--top{
  background:linear-gradient(160deg,#FFDD6E,var(--gold) 55%,var(--gold-edge));
  border-color:var(--gold-edge);color:#33240A;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
}
.pos--euro{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
.tteam{display:flex;align-items:center;gap:10px}
.pts{color:var(--gold-deep);font-weight:700;font-size:14px}


/* ============================================================
   Форма последних матчей и зоны турнира
   ============================================================ */
.form{display:flex;gap:3px;justify-content:center}
.f{
  width:19px;height:19px;flex:none;
  display:grid;place-items:center;border-radius:4px;
  font-family:var(--font-data);font-size:10px;font-weight:700;
  cursor:help;
}
.f--w{background:linear-gradient(160deg,#FFD75E,var(--gold) 55%,var(--gold-edge));color:#33240A;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.f--d{background:#EDE7D8;color:var(--muted)}
.f--l{background:var(--live);color:#fff}
.form-empty{color:var(--muted);font-family:var(--font-data);font-size:12px}
.td-form{white-space:nowrap}

/* цветная полоса зоны слева от места */
tbody tr[class^="z-"] td:first-child,
tbody tr[class*=" z-"] td:first-child{position:relative}
tbody tr[class^="z-"] td:first-child::before,
tbody tr[class*=" z-"] td:first-child::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;
}
tr.z-ucl  td:first-child::before{background:var(--gold)}
tr.z-uel  td:first-child::before{background:#4A7FB5}
tr.z-uecl td:first-child::before{background:#58A06E}
tr.z-rel  td:first-child::before{background:var(--live)}

.pos--ucl{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
.pos--uel{border-color:#4A7FB5;background:#EAF1F8;color:#2F5C88}
.pos--uecl{border-color:#58A06E;background:#E9F5EC;color:#31724A}
.pos--rel{border-color:var(--live);background:#FCEAE7;color:#A81E0B}

.legend{
  display:flex;flex-wrap:wrap;gap:8px 18px;
  padding:2px 0 6px;font-size:12px;color:var(--muted);
}
.legend-item{display:inline-flex;align-items:center;gap:7px}
.legend-bar{width:3px;height:13px;border-radius:2px;flex:none}
.legend-bar--ucl{background:var(--gold)}
.legend-bar--uel{background:#4A7FB5}
.legend-bar--uecl{background:#58A06E}
.legend-bar--rel{background:var(--live)}

.hint-fix{
  display:inline-block;margin-top:6px;
  font-family:var(--font-data);font-size:11.5px;line-height:1.55;
  color:var(--gold-deep);
}
.hint{
  margin:10px 0 0;padding:10px 14px;
  border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:var(--r-sm);background:var(--paper);
  font-size:12.5px;color:var(--muted);
}


/* заголовок группы внутри таблицы */
tbody tr.grouprow td{
  text-align:left;padding:16px 8px 8px;
  font-family:var(--font-data);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold-deep);border-bottom:1px solid var(--line-2);
}
tbody tr.grouprow:hover{background:none}

/* откуда пришла таблица */
.srcline{
  margin:6px 0 0;
  font-family:var(--font-data);font-size:11px;color:var(--muted);
}

/* ============================================================
   Бомбардиры и ассистенты
   ============================================================ */
.ptabs{
  display:inline-flex;gap:2px;margin:18px 0 4px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:100px;padding:3px;
}
.ptabs button{
  padding:7px 16px;border-radius:100px;
  font-weight:600;font-size:13px;color:var(--muted);
  white-space:nowrap;transition:all .18s ease;
}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-pressed="true"]{
  background:linear-gradient(160deg,#FFD75E,var(--gold) 55%,var(--gold-edge));
  color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.ptable{min-width:580px}
.ptable .td-player{text-align:left}
.ptable .td-club{
  text-align:left;font-family:var(--font-body);
  font-size:13px;color:var(--muted);
}
.avatar{
  width:26px;height:26px;flex:none;border-radius:50%;
  object-fit:cover;background:var(--gold-soft);
}

@media (max-width:760px){
  .f{width:17px;height:17px;font-size:9px}
  .ptabs button{padding:7px 12px;font-size:12px}
}

/* ============================================================
   Состояния: загрузка, пусто, ошибка, демо
   ============================================================ */
.skel{
  height:64px;border-radius:var(--r);
  border:1px solid var(--line);
  background:linear-gradient(90deg,var(--paper) 25%,var(--gold-soft) 50%,var(--paper) 75%);
  background-size:400% 100%;
  animation:shimmer 1.3s ease infinite;
}
@keyframes shimmer{to{background-position:-135% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

.notice{
  padding:44px 24px;text-align:center;
  background:var(--paper);
  border:1px dashed var(--line-2);border-radius:var(--r-lg);
  color:var(--muted);
}
.notice b{
  display:block;color:var(--ink);font-family:var(--font-display);
  font-weight:500;font-size:17px;margin-bottom:8px;
}
.notice button{
  margin-top:16px;padding:9px 20px;border-radius:100px;
  background:linear-gradient(160deg,#FFDD6E,var(--gold) 55%,var(--gold-edge));
  border:1px solid var(--gold-edge);
  color:var(--ink);font-weight:700;font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}

.demobar{
  display:none;align-items:center;flex-wrap:wrap;gap:4px 10px;
  margin-top:16px;padding:11px 16px;
  border:1px solid var(--gold);border-radius:var(--r);
  background:var(--gold-soft);
  font-size:13px;color:var(--gold-deep);
}
.demobar.show{display:flex}
.demobar{flex-direction:column;align-items:flex-start;gap:6px}
.demobar-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.demobar strong{flex:none}
.demobar-fix{
  font-family:var(--font-data);font-size:11.5px;line-height:1.5;
  color:var(--muted);
}
.demobar-fix:empty{display:none}
.demobar span{color:var(--muted)}

footer{
  border-top:1px solid var(--line);
  padding:28px 0 46px;
  font-size:12.5px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between;
}


/* ============================================================
   Переключатель туров
   ============================================================ */
.roundnav{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin:18px 0 4px;
}
.roundnav button{
  width:34px;height:34px;flex:none;
  display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:19px;line-height:1;color:var(--muted);
  transition:all .18s ease;
}
.roundnav button:hover{color:var(--gold-deep);border-color:var(--gold);box-shadow:var(--shadow)}
.roundnav-title{
  min-width:170px;text-align:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;
}

/* ============================================================
   Календарь
   ============================================================ */
.cal{
  max-width:620px;
  margin:18px auto 8px;padding:14px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);
}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.cal-nav{
  width:32px;height:32px;flex:none;
  display:grid;place-items:center;border-radius:var(--r-sm);
  font-size:19px;line-height:1;color:var(--muted);
  transition:all .18s ease;
}
.cal-nav:hover{color:var(--gold-deep);background:var(--gold-soft)}
.cal-title{
  font-family:var(--font-display);font-weight:700;font-size:15px;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
}
.cal-dow{
  text-align:center;padding-bottom:6px;
  font-family:var(--font-data);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
}
.cal-cell{
  position:relative;
  height:42px;
  display:grid;place-items:center;
  border:1px solid transparent;border-radius:var(--r-sm);
  font-family:var(--font-data);font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--ink);
  transition:background .16s ease, border-color .16s ease;
}
.cal-cell--empty{pointer-events:none}
.cal-cell:not(.cal-cell--empty):hover{background:var(--gold-soft);border-color:var(--gold)}

/* точка = в этот день есть матчи */
.cal-dot{
  position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:transparent;
}
.cal-cell.has-games .cal-dot{background:var(--gold-edge)}

.cal-cell.is-today{border-color:var(--line-2);font-weight:700}
.cal-cell.is-selected{
  background:linear-gradient(160deg,#FFD75E,var(--gold) 55%,var(--gold-edge));
  border-color:var(--gold-edge);font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.cal-cell.is-selected .cal-dot{background:#33240A}

.dayhead--cal{margin:20px 0 12px}

@media (max-width:760px){
  .roundnav-title{min-width:120px;font-size:13px}
  .cal{padding:10px}
  .cal-grid{gap:3px}
  .cal-cell{height:44px;font-size:12px}
}


/* ============================================================
   Панель ключей
   ============================================================ */
.keys{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;padding:var(--pad);
  background:rgba(25,21,16,.45);
  backdrop-filter:blur(3px);
}
.keys[hidden]{display:none}
.keys-box{
  width:100%;max-width:520px;
  background:var(--paper);
  border:1px solid var(--line-2);border-radius:var(--r-lg);
  padding:clamp(18px,4vw,28px);
  box-shadow:0 24px 60px -20px rgba(93,66,8,.45);
}
.keys-box h2{
  font-family:var(--font-display);font-weight:700;font-size:19px;
  margin-bottom:8px;
}
.keys-box p{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}
.keys-box label{
  display:block;margin-bottom:14px;
  font-family:var(--font-data);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);
}
.keys-box input{
  display:block;width:100%;margin-top:6px;
  padding:10px 13px;
  background:var(--sand);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:var(--font-data);font-size:13px;
  letter-spacing:0;text-transform:none;color:var(--ink);
  outline:none;transition:border-color .18s ease;
}
.keys-box input:focus{border-color:var(--gold)}
.keys-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
#k-close{margin-left:auto}
.k-primary{
  padding:10px 22px;border-radius:100px;
  background:linear-gradient(160deg,#FFD75E,var(--gold) 55%,var(--gold-edge));
  border:1px solid var(--gold-edge);
  color:var(--ink);font-weight:700;font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.k-ghost{
  padding:10px 18px;border-radius:100px;
  border:1px solid var(--line);color:var(--muted);font-size:13px;
}
.k-ghost:hover{color:var(--ink);border-color:var(--line-2)}
#k-result:not(:empty){
  margin-top:16px;padding:12px 14px;
  background:var(--sand);border-radius:var(--r-sm);
}
.k-line{
  display:flex;gap:8px;align-items:baseline;
  font-size:12.5px;line-height:1.6;color:var(--muted);
}
.k-line + .k-line{margin-top:6px}
.k-line b{font-family:var(--font-data);flex:none}
.k-line span{font-weight:600;color:var(--ink)}
.k-line.k-ok b{color:#1B8A4B}
.k-line.k-bad b{color:var(--live)}

/* ============================================================
   Окно матча
   Карточка матча стала ссылкой: клик открывает окно поверх
   списка, кнопка «назад» его закрывает. Сигнатура окна —
   золотая нить хода матча: минуты нанизаны на неё, голы
   отчеканены так же, как счёт на карточке.
   ============================================================ */
a.match{cursor:pointer}
a.match:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:var(--r)}

.sr{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}
body.mp-open{overflow:hidden}

.mp{
  position:fixed;inset:0;z-index:90;
  display:grid;place-items:center;padding:var(--pad);
  background:rgba(25,21,16,.45);
  backdrop-filter:blur(3px);
}
.mp[hidden]{display:none}
.mp-box{
  position:relative;
  width:100%;max-width:640px;
  max-height:calc(100vh - 2 * var(--pad));
  max-height:calc(100dvh - 2 * var(--pad));
  overflow-y:auto;overscroll-behavior:contain;
  background:var(--paper);
  border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:0 24px 60px -20px rgba(93,66,8,.45);
  outline:none;
  animation:mp-in .22s ease-out;
}
@keyframes mp-in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.mp-box{animation:none}}

.mp-top{
  position:sticky;top:0;z-index:3;
  display:flex;align-items:center;gap:12px;
  padding:12px 14px 12px 22px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.mp-eyebrow{
  flex:1;min-width:0;
  font-family:var(--font-data);font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mp-close{
  width:36px;height:36px;flex:none;
  display:grid;place-items:center;
  background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--muted);
  transition:color .18s ease, border-color .18s ease;
}
.mp-close:hover{color:var(--gold-deep);border-color:var(--gold)}

/* шапка: команды и счёт */
.mp-score{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:start;gap:14px;
  padding:24px 22px 10px;
}
.mp-team{display:grid;justify-items:center;gap:10px;text-align:center;min-width:0}
/* На узких экранах сайт прячет эмблемы в карточках, а в окне они нужны */
.mp-team .badge,.lu-team .badge{display:block}
.mp-team .badge-fallback,.lu-team .badge-fallback{display:grid}
.mp-team .badge,.mp-team .badge-fallback{width:56px;height:56px}
.mp-team .badge-fallback{font-size:15px}
.mp-team-name{
  font-family:var(--font-display);font-weight:700;
  font-size:15px;line-height:1.2;overflow-wrap:anywhere;
}
.mp-center{display:grid;justify-items:center;gap:8px;padding-top:6px}
.mp-center .screen{min-width:118px;padding:10px 18px}
.mp-center .screen .num{font-size:32px}
.mp-center .screen .sep{font-size:24px}
.mp-center .screen .clock{font-size:20px}
.mp-status{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-data);font-size:11px;letter-spacing:.04em;
  color:var(--muted);text-align:center;
}
.mp-status--live{color:var(--live);font-weight:700}
.mp-when{font-size:12.5px;color:var(--muted);text-align:center}

/* кто забил — под своей командой */
.mp-scorers{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;
  padding:4px 22px 18px;
}
.mp-sc{list-style:none;display:grid;gap:3px;align-content:start;font-size:12.5px;color:var(--muted)}
.mp-sc--home{text-align:right}
.mp-sc b{color:var(--ink);font-weight:600}
.mp-sc .ic{width:12px;height:12px;vertical-align:-1px;margin:0 3px}
.mp-known{
  grid-column:1 / -1;justify-self:center;margin-top:6px;
  font-family:var(--font-data);font-size:11px;color:var(--gold-deep);
}

/* вкладки окна — как вкладки раздела на странице */
.mp-tabs{
  display:flex;justify-content:center;gap:24px;
  padding:0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.mp-tabs button{
  position:relative;padding:12px 0 11px;
  font-family:var(--font-display);font-weight:500;
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);transition:color .18s ease;
}
.mp-tabs button:hover{color:var(--ink)}
.mp-tabs button[aria-selected="true"]{color:var(--ink)}
.mp-tabs button[aria-selected="true"]::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold-edge));
}

.mp-body{padding:20px 22px 24px}
.mp-body .hint{margin-top:16px}
.mp-skel{display:grid;gap:8px}
.mp-skel .skel{height:40px}
.mp-notice{padding:30px 20px}

/* --- ход матча: золотая нить посередине --- */
.tl{position:relative;display:grid;gap:2px}
.tl::before{
  content:'';position:absolute;top:14px;bottom:14px;left:50%;
  width:2px;margin-left:-1px;border-radius:1px;
  background:linear-gradient(var(--gold-soft),var(--gold) 10%,var(--gold) 90%,var(--gold-soft));
}
.tl-row{
  position:relative;
  display:grid;grid-template-columns:1fr 54px 1fr;
  align-items:center;min-height:44px;
}
.tl-min{
  grid-column:2;grid-row:1;justify-self:center;z-index:1;
  display:grid;justify-items:center;gap:1px;
  min-width:42px;padding:4px 6px;border-radius:100px;
  background:var(--paper);border:1.5px solid var(--gold);
  font-family:var(--font-data);font-variant-numeric:tabular-nums;
  color:var(--gold-deep);line-height:1.1;
}
.tl-min b{font-size:11.5px;font-weight:700}
.tl-min span{font-size:10.5px;font-weight:700;color:#33240A}
.tl-row--goal .tl-min{
  border-radius:10px;padding:5px 7px;
  background:linear-gradient(160deg,#FFDD6E,var(--gold) 48%,var(--gold-edge));
  border-color:var(--gold-edge);color:#33240A;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 3px rgba(154,107,4,.3);
}
.tl-ev{grid-row:1;display:flex;align-items:center;gap:10px;min-width:0}
.tl-ev--home{grid-column:1;justify-content:flex-end;text-align:right;padding-right:12px}
.tl-ev--away{grid-column:3;justify-content:flex-start;text-align:left;padding-left:12px}
.tl-who{display:grid;gap:1px;min-width:0}
.tl-who b{font-weight:600;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.tl-who small{font-size:11.5px;line-height:1.3;color:var(--muted)}
.tl-row--goal .tl-who b{font-weight:700}
.tl-ic{flex:none;display:inline-flex;align-items:center}
.tl-row--mark{min-height:36px}
.tl-mark{
  grid-column:1 / -1;grid-row:1;justify-self:center;z-index:1;
  padding:4px 12px;border-radius:100px;
  background:var(--sand);border:1px solid var(--line-2);
  font-family:var(--font-data);font-size:10.5px;letter-spacing:.06em;
  color:var(--muted);white-space:nowrap;
}
.tl-mark b{color:var(--ink);margin-left:4px}

/* значки событий */
.ic{width:16px;height:16px;flex:none;color:var(--ink);display:inline-block}
.ic--own{color:var(--live)}
.ic--miss{color:var(--muted)}
.ic-card{
  display:inline-block;flex:none;width:10px;height:14px;border-radius:2px;
  transform:rotate(-8deg);box-shadow:0 1px 1px rgba(25,21,16,.2);
}
.ic-card--y{background:#F7DC2B}
.ic-card--r{background:var(--live)}
.ic-card--yr{background:var(--live);box-shadow:-3px -2px 0 #F7DC2B, 0 1px 1px rgba(25,21,16,.2)}
.ic-var{
  flex:none;display:inline-block;padding:2px 3px;
  border:1px solid var(--ink);border-radius:3px;
  font-family:var(--font-data);font-style:normal;font-size:8.5px;font-weight:700;
  letter-spacing:.04em;line-height:1;color:var(--ink);
}

/* --- статистика --- */
.st{display:grid;gap:15px}
.st-row{display:grid;gap:6px}
.st-head{display:grid;grid-template-columns:minmax(3ch,auto) 1fr minmax(3ch,auto);align-items:baseline;gap:10px}
.st-val{
  font-family:var(--font-data);font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--muted);
}
.st-val:last-child{text-align:right}
.st-val--lead{color:var(--ink);font-weight:700}
.st-name{text-align:center;font-size:12.5px;color:var(--muted)}
.st-bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:6px}
.st-bar{display:flex;overflow:hidden;border-radius:3px;background:#F1ECDF}
.st-bar--home{justify-content:flex-end}
.st-bar i{display:block;height:100%;border-radius:3px;background:#D8CFBC}
.st-bar i.lead{background:linear-gradient(90deg,var(--gold),var(--gold-edge))}

/* --- составы --- */
.lu{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.lu-team{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.2;
}
.lu-team .badge,.lu-team .badge-fallback{width:22px;height:22px}
.lu-form{margin-left:auto;font-family:var(--font-data);font-size:11px;font-weight:500;color:var(--gold-deep)}
.lu-h{
  margin:0 0 4px;
  font-family:var(--font-data);font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
}
.lu-h--bench{margin-top:18px}
.lu-list{list-style:none}
.lu-p{
  display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;
  padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.lu-num{
  font-family:var(--font-data);font-size:11.5px;font-weight:700;
  text-align:right;color:var(--gold-deep);font-variant-numeric:tabular-nums;
}
.lu-name{min-width:0;line-height:1.3;overflow-wrap:anywhere}
.lu-pos{font-family:var(--font-data);font-size:10.5px;color:var(--muted);cursor:help}
.lu-ev{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:-2px}
.lu-ev .ic{width:13px;height:13px}
.lu-ev .ic-card{width:8px;height:11px}
.lu-sub{font-family:var(--font-data);font-size:10.5px;font-weight:700}
.lu-sub--in{color:#1B8A4B}
.lu-sub--out{color:var(--live)}
.lu-empty{color:var(--muted)}

/* подвал окна: обзор и стадион */
.mp-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  padding:16px 22px 22px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);
}
.mp-video{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 18px;border-radius:100px;
  background:linear-gradient(160deg,#FFDD6E,var(--gold) 55%,var(--gold-edge));
  border:1px solid var(--gold-edge);
  color:var(--ink);font-weight:700;font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.mp-video:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6), var(--shadow-up)}
.mp-venue{display:inline-flex;align-items:center;gap:6px}

@media (max-width:600px){
  .mp{padding:0;place-items:stretch}
  .mp-box{max-width:none;max-height:none;height:100%;border:none;border-radius:0}
  .mp-top{padding:10px 10px 10px 16px}
  .mp-score{padding:18px 12px 8px;gap:8px}
  .mp-team .badge,.mp-team .badge-fallback{width:44px;height:44px}
  .mp-team-name{font-size:13px}
  .mp-center .screen{min-width:94px;padding:8px 12px}
  .mp-center .screen .num{font-size:26px}
  .mp-center .screen .sep{font-size:20px}
  .mp-center .screen .clock{font-size:17px}
  .mp-scorers{padding:2px 14px 16px;gap:4px 16px}
  .mp-sc{font-size:12px}
  .mp-tabs{gap:18px}
  .mp-tabs button{font-size:11px}
  .mp-body{padding:16px 12px 22px}
  .tl-row{grid-template-columns:1fr 48px 1fr}
  .tl-ev{gap:7px}
  .tl-ev--home{padding-right:8px}
  .tl-ev--away{padding-left:8px}
  .tl-who b{font-size:12.5px}
  .tl-who small{font-size:11px}
  .lu{gap:14px}
  .lu-p{grid-template-columns:20px 1fr;gap:6px;font-size:12.5px}
  .lu-pos{display:none}
  .mp-foot{padding:14px 14px 22px}
}

/* ============================================================
   Адаптив
   ============================================================ */
@media (max-width:760px){
  .brand-name{display:none}
  .sportnav{margin-left:auto;min-width:0}
  .langsw button{padding:5px 8px}
  .sportnav button{padding:8px 10px;font-size:13px}
  .viewtabs{gap:16px}
  .viewtabs button{font-size:11px}
  .hero{padding-top:20px}
  .match{grid-template-columns:1fr;gap:10px;padding:12px 14px}
  .rail{
    border-right:none;border-bottom:1px solid var(--line);
    padding:0 0 9px;text-align:left;place-content:start;
    display:flex;align-items:baseline;gap:7px;
  }
  .rail b{display:inline;font-size:13px}
  .foot{grid-column:1}
  .row{gap:8px}
  .name{font-size:13.5px}
  .badge,.badge-fallback{display:none}
  .name{white-space:normal;overflow:visible;line-height:1.25}

  provider: "thesportsdb",

  // --- TheSportsDB: работает сразу, ключ 123 бесплатный и общий ---
  apiKey: "123",
  base: "https://www.thesportsdb.com/api/v1/json",

  // --- API-Football: точные названия стадий, нужен свой ключ ---
  // Регистрация: dashboard.api-football.com (бесплатно, 100 запросов в сутки)
  afKey: "",
  afBase: "https://v3.football.api-sports.io",

  // --- football-data.org: полная таблица, бесплатно и навсегда ---
  // Ключ: football-data.org/client/register (10 запросов в минуту)
  fdKey: "",
  fdBase: "https://api.football-data.org/v4",

  // на странице его нет, и CORS больше не мешает.
  fdProxy: "https://tablo-proxy.kadirovasliddin004.workers.dev",

  /* Переводить ли названия клубов на русский. По умолчанию выключено:
     словарь покрывает не все команды, и в таблице получался разнобой —
     часть названий по-русски, часть в оригинале. Включишь — дополни CLUBS_RU. */
  translateClubs: false,

  /* Показывать в Лиге чемпионов только команды текущего розыгрыша.
     Иначе в списки попадают матчи квалификации — там играют клубы,
     которые в основную сетку не прошли. */
  clOnlyCurrentTeams: true,

  cacheTtl: 60_000,
  timeout: 9_000
};

/* Ключи и адрес прокси запоминаются в браузере, чтобы не вводить их
   после каждой перезагрузки. Всё обёрнуто в try/catch: если хранилище
   недоступно, значения просто живут до закрытия вкладки, как раньше. */
const store = {
  get(k) { try { return localStorage.getItem("tablo." + k); } catch (e) { return null; } },
  set(k, v) {
    try { v ? localStorage.setItem("tablo." + k, v) : localStorage.removeItem("tablo." + k); }
    catch (e) { /* работаем без запоминания */ }
  }
};

// Сохранённое имеет приоритет над тем, что вписано в CONFIG выше

CONFIG.afKey   = store.get("afKey")   || CONFIG.afKey;
CONFIG.fdProxy = store.get("fdProxy") || CONFIG.fdProxy;

/* Один и тот же клуб приходит по-разному: «FC Barcelona», «Barcelona»,
   «Real Madrid CF», «FC Bayern München». Приводим к общему виду:
   снимаем диакритику и типовые приставки-окончания. */
function clubKey(raw) {
  return String(raw)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/\./g, "")
    .replace(/\b\d{1,4}\b/g, " ")
    .replace(/\s+/g, " ").trim()
    .replace(/^(fc|afc|ac|as|ss|ssc|sc|rc|cf|cd|sv|vfb|vfl|rb|bsc|tsg|fsv|tsv|sg|kv|ogc|rcd)\s+/, "")
    .replace(/\s+(fc|afc|cf|sc|ac|bc|sk|sv|cd|cp|ii)$/, "")
    .trim();
}

function clubName(raw) {
  if (!raw) return "";
  if (!CONFIG.translateClubs || state.lang !== "ru") return raw;
  return CLUBS_RU[clubKey(raw)] || raw;
}

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]

/* У браузеров нет узбекских названий месяцев — Intl отдаёт "M08 25, Tue".
   Поэтому для uz форматируем дату руками. */
const UZ_MONTHS = ["yanvar","fevral","mart","aprel","may","iyun",
                   "iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const UZ_DOW = ["Yak","Dush","Sesh","Chor","Pay","Jum","Shan"];

function fmtDay(d) {
  if (!d) return t().tbd;
  if (state.lang === "uz") {
    return `${UZ_DOW[d.getDay()]}, ${d.getDate()}-${UZ_MONTHS[d.getMonth()]}`;
  }
  return new Intl.DateTimeFormat("ru-RU", { weekday: "short", day: "numeric", month: "long" }).format(d);
}
const pad = (n) => String(n).padStart(2, "0");
const fmtShort = (d) => d ? `${pad(d.getDate())}.${pad(d.getMonth() + 1)}` : "";
const fmtTime  = (d) => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : "—:—";

function parseDate(ev) {
  if (ev.strTimestamp) {
    const raw = ev.strTimestamp.trim().replace(" ", "T");
    const d = new Date(/[zZ]|[+-]\d{2}:?\d{2}$/.test(raw) ? raw : raw + "Z");
    if (!isNaN(d)) return d;
  }
  if (ev.dateEvent) {
    const time = (ev.strTime && ev.strTime !== "00:00:00") ? ev.strTime : "12:00:00";
    const d = new Date(`${ev.dateEvent}T${time}Z`);
    if (!isNaN(d)) return d;
  }
  return null;
}

const dayKey = (d) => d ? `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` : "tbd";
// ISO-ключ для запросов и для индекса дней: 2026-08-24
const isoKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const sameDay = (a, b) => a && b && isoKey(a) === isoKey(b);

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function fmtMonth(d) {
  if (state.lang === "uz") return `${cap(UZ_MONTHS[d.getMonth()])} ${d.getFullYear()}`;
  // Intl добавляет «г.» в конце — для заголовка календаря это лишнее
  const name = new Intl.DateTimeFormat("ru-RU", { month: "long" }).format(d);
  return `${cap(name)} ${d.getFullYear()}`;
}
// Понедельник — первый день недели
const dowIndex = (d) => (d.getDay() + 6) % 7;
const initials = (name) => String(name || "?").trim().slice(0, 2).toUpperCase();

/* ============================================================
   5. СТАДИИ ТУРНИРА
   Это то место, где раньше врал сайт: числа вроде 400 выводились
   как «400-й тур». На деле у TheSportsDB это коды стадий.
   ============================================================ */

// Документировано на thesportsdb.com/docs_api_data
const TSDB_STAGE = {
  125: "qf",           // четвертьфинал
  150: "sf",           // полуфинал
  160: "playoff",      // раунд плей-офф
  170: "playoffSf",    // полуфинал плей-офф
  180: "playoffFinal", // финал плей-офф
  200: "final",        // финал
  400: "qualifier",    // квалификация
  500: "preseason"     // предсезонный матч
};

function stageFromTSDB(intRound, sportId, leagueId) {
  const n = Number(intRound);
  if (!Number.isFinite(n) || n <= 0) return null;
  if (TSDB_STAGE[n]) return { kind: TSDB_STAGE[n] };
  // Незнакомый спецкод лучше не показывать вовсе, чем выдать за номер тура
  if (n > 100) return null;
  if (sportId === "f1") return { kind: "f1", n };
  if (leagueId === "4480") return { kind: "leaguePhase", n };
  return { kind: "matchday", n };
}

// API-Football отдаёт стадию строкой — она точнее любого кода
function stageFromAF(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  const low = s.toLowerCase();
  const n = Number((s.match(/(\d+)\s*$/) || [])[1]);

  if (low.includes("qualif"))                       return { kind: "qualifier" };
  if (low.includes("play-off") || low.includes("playoff")) return { kind: "playoff" };
  if (low.includes("quarter"))                      return { kind: "qf" };
  if (low.includes("semi"))                         return { kind: "sf" };
  if (low.includes("round of 16") || low.includes("8th final")) return { kind: "r16" };
  if (low === "final" || low.endsWith(" final"))    return { kind: "final" };
  if ((low.includes("league stage") || low.includes("group stage")) && n)
    return { kind: "leaguePhase", n };
  if (low.includes("regular season") && n)          return { kind: "matchday", n };
  if (n && low.replace(/\d+/g, "").trim().length <= 12) return { kind: "matchday", n };
  return { kind: "raw", text: s };  // покажем как есть — честнее, чем выдумывать
}

// API отдаёт зону строкой вроде "Promotion - Champions League (Group Stage)"
// или "Relegation - Championship". Порядок проверок важен: «вылет» ищем первым,
// иначе «Relegation - Championship» может зацепиться за другое правило.
function zoneOf(desc) {
  const d = String(desc || "").toLowerCase();
  if (!d) return null;
  if (d.includes("relegation")) return "rel";
  if (d.includes("champions league")) return "ucl";
  if (d.includes("europa league")) return "uel";
  if (d.includes("conference")) return "uecl";
  if (d.includes("promotion")) return "ucl";
  return null;
}

// Когда источник не сказал зону — считаем по месту
function zoneByPosition(leagueId, rank, total) {
  const z = ZONES[leagueId];
  if (!z || !total) return null;
  if (rank <= z.ucl) return "ucl";
  if (rank <= z.uel) return "uel";
  if (rank <= z.uecl) return "uecl";
  if (z.rel && rank > total - z.rel) return "rel";
  return null;
}

function stageLabel(stage) {
  if (!stage) return null;
  if (stage.kind === "raw") return { short: stage.text, full: stage.text };
  const def = t().stage[stage.kind];
  if (!def) return null;
  return typeof def === "function" ? def(stage.n) : def;
}

// Ошибка с понятной причиной — чтобы страница могла объяснить,
// что именно сломалось, а не показывать «не удалось получить ответ».
class ApiError extends Error {
  constructor(kind, detail) { super(kind); this.kind = kind; this.detail = detail || ""; }
}

const isFileOrigin = () => location.protocol === "file:";

const tsdbUrl = (path) => `${CONFIG.base}/${CONFIG.apiKey}/${path}`;

async function getJSON(path) {
  const url = tsdbUrl(path);
  const hit = cache.get(url);
  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) return hit.data;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.timeout);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal });
  } catch (e) {
    // fetch падает одинаково и при CORS, и при отсутствии сети —
    // различаем по протоколу страницы
    throw new ApiError(
      e.name === "AbortError" ? "timeout" : (isFileOrigin() ? "file" : "cors"), path);
  } finally { clearTimeout(timer); }

  if (res.status === 429) throw new ApiError("rate", "429");
  if (!res.ok) throw new ApiError("http", String(res.status));

  const data = await res.json();
  cache.set(url, { at: Date.now(), data });
  return data;
}

function useApiFootball(sport) {
  return CONFIG.provider === "apifootball" && CONFIG.afKey && sport.id === "football";
}

async function afGet(path) {
  const url = `${CONFIG.afBase}${path}`;
  const hit = cache.get(url);
  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) return hit.data;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.timeout);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal, headers: { "x-apisports-key": CONFIG.afKey } });
  } catch (e) {
    throw new ApiError(
      e.name === "AbortError" ? "timeout" : (isFileOrigin() ? "file" : "cors"), path);
  } finally { clearTimeout(timer); }

  if (res.status === 401 || res.status === 403) throw new ApiError("key", String(res.status));
  if (res.status === 429) throw new ApiError("rate", "429");
  if (!res.ok) throw new ApiError("http", String(res.status));

  const data = await res.json();
  // API-Football кладёт ошибки в тело ответа со статусом 200
  const errs = data.errors;
  if (errs && !Array.isArray(errs) && Object.keys(errs).length) {
    const first = Object.values(errs)[0];
    throw new ApiError(/key|token|subscription/i.test(String(first)) ? "key" : "http", String(first));
  }
  cache.set(url, { at: Date.now(), data });
  return data;
}

/* OpenLigaDB — открытый немецкий проект. Ключа не требует вообще
   и отдаёт таблицу целиком. Минус: только немецкие лиги, и это
   community-проект, поэтому иногда отвечает ошибкой. */
async function olGet(path) {
  const url = `https://api.openligadb.de${path}`;
  const hit = cache.get(url);
  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) return hit.data;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.timeout);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal });
  } catch (e) {
    throw new ApiError(
      e.name === "AbortError" ? "timeout" : (isFileOrigin() ? "file" : "cors"), path);
  } finally { clearTimeout(timer); }

  if (!res.ok) throw new ApiError("http", String(res.status));
  const data = await res.json();
  cache.set(url, { at: Date.now(), data });
  return data;
}

async function fdGet(path) {
  // Через прокси заголовок с ключом не нужен — а без него браузер
  // не шлёт проверочный OPTIONS, из-за которого всё и упиралось в CORS
  const viaProxy = !!CONFIG.fdProxy;
  const url = `${viaProxy ? CONFIG.fdProxy.replace(/\/+$/, "") : CONFIG.fdBase}${path}`;
  const hit = cache.get(url);
  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) return hit.data;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.timeout);
  let res;
  try {
    res = await fetch(url, {
      signal: ctrl.signal,
      headers: viaProxy ? {} : { "X-Auth-Token": CONFIG.fdKey }
    });
  } catch (e) {
    throw new ApiError(
      e.name === "AbortError" ? "timeout" : (isFileOrigin() ? "file" : "cors"), path);
  } finally { clearTimeout(timer); }

  if (res.status === 400 || res.status === 403) throw new ApiError("key", String(res.status));
  if (res.status === 429) throw new ApiError("rate", "429");
  if (!res.ok) throw new ApiError("http", String(res.status));

  const data = await res.json();
  cache.set(url, { at: Date.now(), data });
  return data;
}

/* Состав участников определяется жеребьёвкой каждый сезон, поэтому
   зашить его в код нельзя — только спросить у источника.
   Держим сутки: в течение сезона он не меняется. */
const teamsCache = new Map();

async function currentTeams(league) {
  const key = `${league.fdCode}:teams`;
  const hit = teamsCache.get(key);
  if (hit && Date.now() - hit.at < 86_400_000) return hit.set;

  const d = await fdGet(`/competitions/${league.fdCode}/teams`);
  const set = new Set();
  for (const t of (d.teams || [])) {
    /* Берём только полное и короткое название. Трёхбуквенные коды
       вроде «FCB» сюда не кладём: после чистки от них остаются
       обрывки, которые могут случайно совпасть с чужим клубом. */
    for (const v of [t.name, t.shortName]) if (v) set.add(clubKey(v));
  }
  if (set.size < 8) throw new ApiError("empty", "teams");
  teamsCache.set(key, { at: Date.now(), set });
  return set;
}

async function onlyCurrentTeams(items, league) {
  if (!CONFIG.clOnlyCurrentTeams || !league.onlyCurrent || !league.fdCode) return items;
  if (!CONFIG.fdKey && !CONFIG.fdProxy) return items;      // спросить не у кого

  let set;
  try { set = await currentTeams(league); }
  catch (e) { return items; }                              // не вышло — показываем всё

  const inSet = (n) => set.has(clubKey(n || ""));
  const kept = items.filter((m) => inSet(m.home) && inSet(m.away));

  /* Предохранитель: у разных API написание клубов отличается, и если
     сопоставление вдруг развалится, отсеется всё подряд. Тогда лучше
     показать список целиком, чем пустой экран. */
  return kept.length ? kept : items;
}

// В API-Football сезон — один год: 2026-2027 → 2026
const afSeason = (league) => String(league.season).slice(0, 4);

/* Бесплатный тариф API-Football ограничен по доступным сезонам: текущий
   он обычно не отдаёт. Поэтому шагаем от свежего к старому, пока не придут
   данные, и запоминаем найденный год — чтобы не тратить запросы повторно. */
const afSeasonCache = new Map();
let afWindowTop = null;   // верхняя граница диапазона, о которой сообщил сам API

/* API-Football в тексте ошибки прямо пишет допустимый диапазон:
   «Free plans do not have access to this season, try from 2022 to 2024».
   Читаем его и прыгаем сразу на нужный год — вместо перебора вслепую.
   Это ещё и экономит суточный лимит в 100 запросов. */
function seasonRangeFrom(detail) {
  const m = String(detail || "").match(/from\s+(\d{4})\s+to\s+(\d{4})/i);
  return m ? Number(m[2]) : null;
}

async function afResolveSeason(league) {
  const want = Number(afSeason(league));
  const key = String(league.afId);

  if (afSeasonCache.has(key)) {
    const got = afSeasonCache.get(key);
    state.seasonShift = got === want ? null : got;
    return got;
  }

  // Если диапазон уже известен по другому турниру — начинаем прямо с него
  const queue = [afWindowTop ? Math.min(want, afWindowTop) : want];
  const tried = new Set();

  for (let step = 0; step < 6; step++) {
    const y = queue.shift();
    if (y === undefined || tried.has(y)) continue;
    tried.add(y);

    try {
      const d = await afGet(`/fixtures?league=${league.afId}&season=${y}&last=1`);
      if ((d.response || []).length) {
        afSeasonCache.set(key, y);
        state.seasonShift = y === want ? null : y;
        return y;
      }
      queue.push(y - 1);                       // ответ пустой, но без ошибки
    } catch (e) {
      if (e.kind === "key" || e.kind === "rate") throw e;

      const top = seasonRangeFrom(e.detail);
      if (top) {
        afWindowTop = top;                     // запоминаем для остальных турниров
        queue.length = 0;
        queue.push(top, top - 1, top - 2);
      } else {
        queue.push(y - 1);
      }
    }
  }

  // Раньше здесь возвращался текущий сезон, и следом уходил заведомо
  // отвергаемый запрос — вместо понятной ошибки получалась путаница
  throw new ApiError("season", String(want));
}

function normalizeEvent(ev, sport, league) {
  const date = parseDate(ev);
  const hs = ev.intHomeScore, as = ev.intAwayScore;
  const hasScore = hs !== null && hs !== "" && hs !== undefined &&
                   as !== null && as !== "" && as !== undefined;
  const status = String(ev.strStatus || "").toUpperCase();

  return {
    src: "tsdb",
    id: ev.idEvent,
    title: ev.strEvent || "",
    home: ev.strHomeTeam || "",
    away: ev.strAwayTeam || "",
    homeId: ev.idHomeTeam || "",
    awayId: ev.idAwayTeam || "",
    homeBadge: ev.strHomeTeamBadge || "",
    awayBadge: ev.strAwayTeamBadge || "",
    homeScore: hasScore ? Number(hs) : null,
    awayScore: hasScore ? Number(as) : null,
    stage: stageFromTSDB(ev.intRound, sport.id, league.id),
    leagueId: ev.idLeague || league.id,
    leagueName: ev.strLeague || "",
    venue: ev.strVenue || "",
    video: safeVideo(ev.strVideo),
    date,
    ts: date ? date.getTime() : 0,
    live: ["1H", "2H", "HT", "ET", "P", "BT"].includes(status),
    postponed: String(ev.strPostponed || "").toLowerCase() === "yes" || ["PST", "POSTP"].includes(status),
    finished: hasScore || ["FT", "AET", "PEN"].includes(status)
  };
}

/* Ссылка на обзор попадает в href, поэтому пропускаем только YouTube:
   адрес вида javascript:… выполнился бы по клику. */
function safeVideo(raw) {
  try {
    const u = new URL(String(raw || ""));
    if (u.protocol !== "https:" && u.protocol !== "http:") return "";
    const host = u.hostname.replace(/^(www|m)\./, "");
    return host === "youtube.com" || host === "youtu.be" ? u.href : "";
  } catch (e) { return ""; }
}

function normalizeAF(f) {
  const date = f.fixture?.date ? new Date(f.fixture.date) : null;
  const short = f.fixture?.status?.short || "";
  const hs = f.goals?.home, as = f.goals?.away;
  const hasScore = hs !== null && hs !== undefined && as !== null && as !== undefined;

  return {
    src: "af",
    id: String(f.fixture?.id ?? ""),
    title: `${f.teams?.home?.name || ""} - ${f.teams?.away?.name || ""}`,
    home: f.teams?.home?.name || "",
    away: f.teams?.away?.name || "",
    homeBadge: f.teams?.home?.logo || "",
    awayBadge: f.teams?.away?.logo || "",
    homeScore: hasScore ? hs : null,
    awayScore: hasScore ? as : null,
    stage: stageFromAF(f.league?.round),
    venue: f.fixture?.venue?.name || "",
    date,
    ts: date ? date.getTime() : 0,
    live: ["1H", "2H", "HT", "ET", "P", "LIVE"].includes(short),
    finished: ["FT", "AET", "PEN"].includes(short)
  };
}

/* --- Стратегия для бесплатного ключа TheSportsDB ---
   Замеры живых ответов:
     eventspastleague / eventsnextleague  -> 1 матч
     eventsround                          -> 5 матчей
     eventsseason                         -> 15 матчей
   Поэтому один дешёвый запрос определяет текущий тур,
   а сами матчи забираем турами — это в 15 раз больше данных. */

async function tsdbAnchor(league) {
  const d = await getJSON(`eventspastleague.php?id=${league.id}`);
  const e = (d.events || [])[0];
  if (!e) throw new ApiError("empty", "eventspastleague");
  return { round: Number(e.intRound) || 1, season: e.strSeason || league.season };
}

const windowCache = new Map();

// Окно из трёх туров вокруг текущего
async function tsdbWindow(league, sport) {
  const key = `${league.id}:w`;
  const hit = windowCache.get(key);
  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) return hit.items;

  const a = await tsdbAnchor(league);
  const rounds = [a.round - 1, a.round, a.round + 1].filter((r) => r >= 1 && r <= 60);
  const chunks = await Promise.allSettled(
    rounds.map((r) => getJSON(`eventsround.php?id=${league.id}&r=${r}&s=${a.season}`)));

  const raw = [];
  for (const c of chunks) if (c.status === "fulfilled") raw.push(...(c.value.events || []));
  if (!raw.length) throw new ApiError("empty", "eventsround");

  const seen = new Set();
  const items = raw
    .filter((e) => seen.has(e.idEvent) ? false : (seen.add(e.idEvent), true))
    .map((e) => normalizeEvent(e, sport, league));

  windowCache.set(key, { at: Date.now(), items });
  return items;
}

// UFC и Формула-1: туров нет, зато сезон целиком даёт 15 событий вместо одного
async function tsdbSeason(league, sport) {
  const key = `${league.id}:s`;
  const hit = windowCache.get(key);
  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) return hit.items;

  const d = await getJSON(`eventsseason.php?id=${league.id}&s=${league.season}`);
  const raw = d.events || [];
  if (!raw.length) throw new ApiError("empty", "eventsseason");
  const items = raw.map((e) => normalizeEvent(e, sport, league));
  windowCache.set(key, { at: Date.now(), items });
  return items;
}

const isPast = (m) => m.finished || (m.ts && m.ts < Date.now());

async function loadResults(league, sport) {
  if (useApiFootball(sport)) {
    const y = await afResolveSeason(league);
    const d = await afGet(`/fixtures?league=${league.afId}&season=${y}&last=20`);
    const rows = await onlyCurrentTeams((d.response || []).map(normalizeAF), league);
    return rows.sort((a, b) => b.ts - a.ts);
  }
  const all = await onlyCurrentTeams(sport.kind === "event"
    ? await tsdbSeason(league, sport)
    : await tsdbWindow(league, sport), league);
  const past = all.filter(isPast).sort((a, b) => b.ts - a.ts);
  return past.length ? past : all.sort((a, b) => b.ts - a.ts);
}

async function loadSchedule(league, sport) {
  if (useApiFootball(sport)) {
    const y = await afResolveSeason(league);
    const d = await afGet(`/fixtures?league=${league.afId}&season=${y}&next=20`);
    const rows = await onlyCurrentTeams((d.response || []).map(normalizeAF), league);
    return rows.sort((a, b) => a.ts - b.ts);
  }
  const all = await onlyCurrentTeams(sport.kind === "event"
    ? await tsdbSeason(league, sport)
    : await tsdbWindow(league, sport), league);
  const next = all.filter((m) => !isPast(m)).sort((a, b) => a.ts - b.ts);
  return next.length ? next : all.sort((a, b) => a.ts - b.ts);
}

// Все матчи одного тура целиком
async function loadRound(league, sport, round) {
  if (useApiFootball(sport)) {
    const r = league.id === "4480" ? `League Stage - ${round}` : `Regular Season - ${round}`;
    const y = await afResolveSeason(league);
    const d = await afGet(`/fixtures?league=${league.afId}&season=${y}&round=${encodeURIComponent(r)}`);
    return (d.response || []).map(normalizeAF).sort((a, b) => a.ts - b.ts);
  }
  const data = await getJSON(`eventsround.php?id=${league.id}&r=${round}&s=${league.season}`);
  const rows = (data.events || []).map((e) => normalizeEvent(e, sport, league));
  return (await onlyCurrentTeams(rows, league)).sort((a, b) => a.ts - b.ts);
}

// Матчи конкретной даты
async function loadDay(league, sport, date) {
  const iso = isoKey(date);
  if (useApiFootball(sport)) {
    const y = await afResolveSeason(league);
    const d = await afGet(`/fixtures?league=${league.afId}&season=${y}&date=${iso}`);
    return (d.response || []).map(normalizeAF).sort((a, b) => a.ts - b.ts);
  }
  const data = await getJSON(`eventsday.php?d=${iso}&l=${league.id}`);
  const rows = (data.events || []).map((e) => normalizeEvent(e, sport, league));
  return (await onlyCurrentTeams(rows, league)).sort((a, b) => a.ts - b.ts);
}

/* Бомбардиры. Источников два, и у каждого свой изъян:
     football-data.org — текущий сезон, но передачи может не отдать
     API-Football      — передачи есть, но сезон только прошлый
   Поэтому берём то, что реально пришло, и честно подписываем. */

async function fdScorers(league, limit) {
  const d = await fdGet(`/competitions/${league.fdCode}/scorers?limit=${limit || 20}`);
  const raw = d.scorers || [];
  if (!raw.length) throw new ApiError("empty", "scorers");

  const rows = raw.map((r, i) => ({
    rank: i + 1,
    name: r.player?.name || "",
    photo: "",
    team: r.team?.shortName || r.team?.name || "",
    teamBadge: r.team?.crest || "",
    games: r.playedMatches ?? null,
    goals: r.goals ?? 0,
    assists: r.assists ?? null,      // на бесплатном тарифе бывает пусто
    penalty: r.penalties ?? null
  }));
  state.playerSource = "football-data.org";
  state.playerSeason = d.season?.startDate ? d.season.startDate.slice(0, 4) : null;
  return rows;
}

async function afPlayers(league, sport, kind) {
  if (!CONFIG.afKey) throw new ApiError("empty", "no-af-key");
  const path = kind === "assists" ? "topassists" : "topscorers";
  const y = await afResolveSeason(league);
  const d = await afGet(`/players/${path}?league=${league.afId}&season=${y}`);
  const rows = (d.response || []).map((r, i) => {
    const st = r.statistics?.[0] || {};
    return {
      rank: i + 1,
      name: r.player?.name || "",
      photo: r.player?.photo || "",
      team: st.team?.name || "",
      teamBadge: st.team?.logo || "",
      games: st.games?.appearences || 0,
      goals: st.goals?.total || 0,
      assists: st.goals?.assists || 0,
      penalty: st.penalty?.scored || 0
    };
  });
  if (!rows.length) throw new ApiError("empty", "topscorers");
  state.playerSource = "API-Football";
  state.playerSeason = String(y);
  return rows;
}

async function loadPlayers(league, sport, kind) {
  state.playerSource = null;
  state.playerSeason = null;
  state.assistsMissing = false;
  state.playersFdError = null;

  const hasFd = (CONFIG.fdKey || CONFIG.fdProxy) && league.fdCode;

  if (hasFd) {
    try {
      const rows = await fdScorers(league);
      const anyAssists = rows.some((r) => r.assists !== null && r.assists !== undefined);

      if (kind === "assists") {
        if (anyAssists) {
          return rows.slice()
            .sort((a, b) => (b.assists || 0) - (a.assists || 0))
            .map((r, i) => ({ ...r, rank: i + 1 }));
        }
        // Передач нет — пробуем второй источник, он их отдаёт
        state.assistsMissing = true;
        try { return await afPlayers(league, sport, kind); }
        catch (e2) { state.playerSource = "football-data.org"; return rows; }
      }
      return rows;
    } catch (e) {
      // Раньше причина терялась, и было непонятно, почему сезон прошлый
      state.playersFdError = e;
      if (e.kind === "rate") throw e;
    }
  }

  return await afPlayers(league, sport, kind);
}

// Результаты + расписание в одном списке. Нужны, чтобы отметить точками
// дни с матчами и чтобы было чем подстраховать тур и календарь.
async function loadAround(league, sport) {
  const [past, next] = await Promise.allSettled([
    loadResults(league, sport),
    loadSchedule(league, sport)
  ]);
  const all = []
    .concat(past.status === "fulfilled" ? past.value : [])
    .concat(next.status === "fulfilled" ? next.value : []);
  // убираем дубли по id
  const seen = new Set();
  return all.filter((m) => (m.id && seen.has(m.id)) ? false : (seen.add(m.id), true));
}

/* Таблицу берём из лучшего доступного источника. Порядок важен:
   football-data.org отдаёт таблицу целиком, API-Football тоже,
   а TheSportsDB на бесплатном ключе обрезает её до пяти строк. */

// football-data.org: полная таблица, форма приходит строкой "W,D,L,W,W"
async function fdTable(league) {
  const d = await fdGet(`/competitions/${league.fdCode}/standings`);
  const blocks = (d.standings || []).filter((b) => b.type === "TOTAL");
  if (!blocks.length) throw new ApiError("empty", "standings");

  const rows = [];
  for (const b of blocks) {
    for (const r of (b.table || [])) {
      rows.push({
        rank:   r.position,
        team:   r.team?.shortName || r.team?.name || "",
        badge:  r.team?.crest || "",
        played: r.playedGames || 0,
        win:    r.won || 0,
        draw:   r.draw || 0,
        loss:   r.lost || 0,
        gf:     r.goalsFor || 0,
        ga:     r.goalsAgainst || 0,
        gd:     Number(r.goalDifference) || 0,
        points: r.points || 0,
        form:   r.form || "",
        group:  b.group || null,
        zone:   null              // источник зоны не присылает, посчитаем ниже
      });
    }
  }
  state.tableSource = "football-data.org";
  return rows;
}

// Места в ответе нет — порядок массива и есть порядок в таблице
async function olTable(league) {
  const year = afSeason(league);
  const raw = await olGet(`/getbltable/${league.olCode}/${year}`);
  if (!Array.isArray(raw) || !raw.length) throw new ApiError("empty", "getbltable");

  const rows = raw.map((r, i) => ({
    rank:   i + 1,
    team:   r.teamName || r.shortName || "",
    badge:  r.teamIconUrl || "",
    played: r.matches || 0,
    win:    r.won || 0,
    draw:   r.draw || 0,
    loss:   r.lost || 0,
    gf:     r.goals || 0,
    ga:     r.opponentGoals || 0,
    gd:     Number(r.goalDiff) || 0,
    points: r.points || 0,
    form:   "",                 // формы этот источник не отдаёт
    group:  null,
    zone:   null
  }));
  state.tableSource = "OpenLigaDB";
  return rows;
}

/* Места нумеруем сами. API при равенстве очков нередко ставит командам
   одинаковый номер — 5, 5, 7 — а в таблице нужен сплошной счёт.
   Порядок строк при этом не трогаем: его источник уже выстроил
   по своим правилам дополнительных показателей. */
function renumber(rows) {
  const perGroup = new Map();
  for (const r of rows) {
    const g = r.group || "";
    const n = (perGroup.get(g) || 0) + 1;
    perGroup.set(g, n);
    r.rank = n;
  }
  return rows;
}

// Зону считаем после перенумерации — иначе она съедет на строку
function fillZones(rows, leagueId) {
  const sizes = new Map();
  for (const r of rows) sizes.set(r.group || "", (sizes.get(r.group || "") || 0) + 1);
  for (const r of rows) {
    if (!r.zone) r.zone = zoneByPosition(leagueId, r.rank, sizes.get(r.group || ""));
  }
  return rows;
}

async function loadTable(league, sport) {
  const rows = await loadTableRaw(league, sport);
  return fillZones(renumber(rows), league.id);
}

async function loadTableRaw(league, sport) {
  state.fdError = null;
  if ((CONFIG.fdKey || CONFIG.fdProxy) && league.fdCode) {
    try { return await fdTable(league); }
    catch (e) {
      // Раньше ошибка терялась, и было непонятно, почему строк всего пять
      state.fdError = e;
      if (e.kind === "key") throw e;
    }
  }

  if (useApiFootball(sport)) {
    const y = await afResolveSeason(league);
    const d = await afGet(`/standings?league=${league.afId}&season=${y}`);
    const rows = d.response?.[0]?.league?.standings?.[0] || [];
    state.tableSource = "API-Football";
    return rows.map((r) => ({
      rank: r.rank, team: r.team?.name || "", badge: r.team?.logo || "",
      played: r.all?.played || 0, win: r.all?.win || 0,
      draw: r.all?.draw || 0, loss: r.all?.lose || 0,
      gf: r.all?.goals?.for || 0, ga: r.all?.goals?.against || 0,
      gd: Number(r.goalsDiff) || 0, points: r.points || 0,
      form: r.form || "", group: null,
      zone: zoneOf(r.description)
    }));
  }

  // Ключей нет, но для немецких лиг полная таблица доступна и так
  if (league.olCode) {
    try { return await olTable(league); } catch (e) { /* дальше — запасной вариант */ }
  }

  const data = await getJSON(`lookuptable.php?l=${league.id}&s=${league.season}`);
  const raw = data.table || [];
  state.tableSource = "TheSportsDB";
  return raw.map((r) => ({
    rank:   Number(r.intRank),
    team:   r.strTeam,
    badge:  r.strBadge || r.strTeamBadge || "",
    played: Number(r.intPlayed) || 0,
    win:    Number(r.intWin) || 0,
    draw:   Number(r.intDraw) || 0,
    loss:   Number(r.intLoss) || 0,
    gf:     Number(r.intGoalsFor) || 0,
    ga:     Number(r.intGoalsAgainst) || 0,
    gd:     Number(r.intGoalDifference ?? (r.intGoalsFor - r.intGoalsAgainst)) || 0,
    points: Number(r.intPoints) || 0,
    form:   r.strForm || "",
    group:  r.strGroup || null,
    zone:   zoneOf(r.strDescription)
  }));
}

/* --- Подробности матча ---
   TheSportsDB отдаёт ход матча, статистику и составы тремя запросами.
   Бесплатный ключ 123 обрезает каждый ответ до 5 записей, платный — до 100,
   этого хватает на любой матч. Записи идут по времени, поэтому на
   бесплатном ключе пропадает конец матча: в игре 5:3 видны 4 гола из 8
   (проверено на живых запросах). Поэтому обрезку всегда подписываем. */
const TSDB_FREE_KEY = "123";
const TSDB_FREE_CAP = 5;
const tsdbFree = () => CONFIG.apiKey === TSDB_FREE_KEY;

const GOAL_TYPES = ["goal", "pen", "own"];
const detailCache = new Map();             // id матча → { at, ttl, data }
const matchIndex = new Map();              // id → матч из уже показанных списков

// В ответах API пустое значение бывает и null, и строкой "NULL"
const blank = (v) => v === null || v === undefined || String(v).trim() === "" ||
                     String(v).trim().toUpperCase() === "NULL";

function leagueById(id) {
  for (const s of SPORTS) for (const l of s.leagues) if (l.id === String(id)) return l;
  return null;
}

function tsdbSide(r, match) {
  const h = String(r.strHome || "").toLowerCase();
  if (h === "yes") return "home";
  if (h === "no") return "away";
  return match && String(r.idTeam) === String(match.homeId) ? "home" : "away";
}

function tsdbEvent(r, i, match) {
  const kind = String(r.strTimeline || "").toLowerCase();
  const detail = String(r.strTimelineDetail || "").toLowerCase();
  let type;
  if (kind === "goal") {
    // «Missed Penalty» приходит как гол — это не гол
    type = detail.includes("miss") ? "miss"
         : detail.includes("own") ? "own"
         : detail.includes("pen") ? "pen" : "goal";
  } else if (kind === "card") {
    type = detail.includes("second") ? "yellow2"
         : detail.includes("red") ? "red" : "yellow";
  } else if (kind.startsWith("subst")) {
    type = "sub";
  } else if (kind === "var") {
    type = "var";
  } else {
    return null;                           // незнакомый тип не выдумываем
  }
  const min = parseInt(r.intTime, 10);
  return {
    i, type,
    side: tsdbSide(r, match),               // у автогола это команда, которой его засчитали
    min: Number.isFinite(min) ? min : null,
    player: blank(r.strPlayer) ? "" : String(r.strPlayer),
    // У гола здесь автор передачи. У замены strPlayer — кто ушёл,
    // strAssist — кто вышел: Ивоби в стартовом составе, а в замене он в strPlayer
    other: blank(r.strAssist) ? "" : String(r.strAssist),
    comment: blank(r.strComment) ? "" : String(r.strComment),
    detail: String(r.strTimelineDetail || "")
  };
}

function statRow(key, hv, av) {
  const label = String(key || "").trim();
  if (!label || (blank(hv) && blank(av))) return null;
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const show = (v) => blank(v) ? "0" : String(v).trim();
  return { key: label.toLowerCase(), label, home: show(hv), away: show(av), h: num(hv), a: num(av) };
}

// Линия на поле по названию позиции: вратарь, защита, полузащита, атака
function posLine(raw) {
  const p = String(raw || "").toLowerCase();
  if (!p) return "";
  if (p.includes("goal")) return "G";
  // Полузащиту проверяем раньше защиты: «Defensive Midfield» — это опорник
  if (p.includes("midfield")) return "M";
  if (p.includes("back") || p.includes("defen")) return "D";
  if (p.includes("wing") || p.includes("forward") || p.includes("striker")) return "F";
  return "";
}
const LINE_RANK = { G: 0, D: 1, M: 2, F: 3, "": 4 };

function tsdbLineups(rows, match) {
  const team = () => ({ start: [], bench: [], formation: "" });
  const out = { home: team(), away: team() };
  for (const r of rows) {
    if (blank(r.strPlayer)) continue;
    const p = {
      num: blank(r.intSquadNumber) ? "" : String(r.intSquadNumber),
      name: String(r.strPlayer),
      line: posLine(r.strPosition)
    };
    const s = out[tsdbSide(r, match)];
    (String(r.strSubstitute || "").toLowerCase() === "yes" ? s.bench : s.start).push(p);
  }
  for (const s of [out.home, out.away]) s.start.sort((a, b) => LINE_RANK[a.line] - LINE_RANK[b.line]);
  return out;
}

async function matchDetails(id, known, force) {
  const hit = detailCache.get(id);
  if (!force && hit && Date.now() - hit.at < hit.ttl) return hit.data;

  const paths = [
    `lookupevent.php?id=${id}`,
    `lookuptimeline.php?id=${id}`,
    `lookupeventstats.php?id=${id}`,
    `lookuplineup.php?id=${id}`
  ];
  if (force) for (const p of paths) cache.delete(tsdbUrl(p));

  // Сам матч спрашиваем, только если его нет в уже загруженных списках —
  // например, когда окно открыли по ссылке. Так выходит на запрос меньше.
  const [ev, tl, st, lu] = await Promise.allSettled([
    known ? Promise.resolve(null) : getJSON(paths[0]),
    getJSON(paths[1]), getJSON(paths[2]), getJSON(paths[3])
  ]);

  let match = known;
  if (!match && ev.status === "fulfilled") {
    const e = (ev.value?.events || [])[0];
    if (e) match = normalizeEvent(e, SPORTS[0], leagueById(e.idLeague) || state.league);
  }
  if (!match) throw ev.status === "rejected" ? ev.reason : new ApiError("empty", "lookupevent");
  if ([tl, st, lu].every((p) => p.status === "rejected")) throw tl.reason;

  const list = (p, key) => p.status === "fulfilled" && Array.isArray(p.value?.[key]) ? p.value[key] : [];
  const tlRaw = list(tl, "timeline"), stRaw = list(st, "eventstats"), luRaw = list(lu, "lineup");
  const limit = tsdbFree() ? TSDB_FREE_CAP : Infinity;

  const data = {
    match,
    events: tlRaw.map((r, i) => tsdbEvent(r, i, match)).filter(Boolean),
    stats: stRaw.map((r) => statRow(r.strStat, r.intHome, r.intAway)).filter(Boolean),
    lineups: tsdbLineups(luRaw, match),
    // Ровно столько записей, сколько разрешает ключ, — значит, ответ обрезан
    cut: { events: tlRaw.length >= limit, stats: stRaw.length >= limit, lineups: luRaw.length >= limit }
  };
  // Сыгранный матч уже не изменится — держим дольше
  detailCache.set(id, { at: Date.now(), ttl: match.finished ? 30 * 60_000 : 60_000, data });
  return data;
}

      awayScore: past ? Math.floor(seeded(i * 7 + Number(leagueId)) * 3) : null,
      stage, venue: "", date, ts: date.getTime(), live: false, finished: past
    });
  }
  return out.sort((a, b) => past ? b.ts - a.ts : a.ts - b.ts);
}
